<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F97316">
<meta name="description" content="食训记 · 饮食记录与训练安排，数据只存在你自己的设备上。">
<!-- 图标用内联 SVG，不引外部文件。有图标浏览器才不会每次请求 favicon.ico 报 404，
     加到手机桌面时也有个像样的样子。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F97316'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M22 32.5l7 7 13-15' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F97316'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M22 32.5l7 7 13-15' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>食训记</title>
<style>
/* ============================================================
   食训记 · 单文件 App
   设计令牌：颜色 / 间距 / 字号 / 圆角
   ============================================================ */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --card-2:#F7F8FA; --text:#17181A;
  --text-2:#6C7078; --text-3:#9AA0A8; --line:#E7E9ED; --line-2:#EFF1F4;
  --brand:#F97316; --brand-soft:rgba(249,115,22,.12);
  --carb:#3B82F6; --carb-soft:rgba(59,130,246,.14);
  --fat:#EAB308;  --fat-soft:rgba(234,179,8,.16);
  --prot:#22C55E; --prot-soft:rgba(34,197,94,.14);
  --danger:#E5484D; --good:#12A150;
  --good-soft:#E7F6EE; --good-text:#0B6B36;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --shadow-lg:0 24px 60px -20px rgba(16,24,40,.32);
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --sp:4px; --page:16px; --maxw:720px;
  --fs-hero:44px; --fs-xl:26px; --fs-lg:20px; --fs-md:16px; --fs-sm:14px; --fs-xs:12.5px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1013; --card:#181B20; --card-2:#20242A; --text:#F2F3F5;
    --text-2:#9BA1AA; --text-3:#6E747C; --line:#282D34; --line-2:#22262C;
    --brand:#FB923C; --brand-soft:rgba(251,146,60,.16);
    --carb:#60A5FA; --carb-soft:rgba(96,165,250,.18);
    --fat:#FACC15;  --fat-soft:rgba(250,204,21,.18);
    --prot:#4ADE80; --prot-soft:rgba(74,222,128,.18);
    --good-soft:rgba(18,161,80,.18); --good-text:#7EE2A8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:var(--fs-md); line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-wrap:break-word;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.tiny{font-size:var(--fs-xs)}

/* ---------- 应用外壳 ---------- */
#app{max-width:var(--maxw);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.appbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s ease;
}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar-in{display:flex;align-items:center;gap:10px;padding:12px var(--page);min-height:60px}
.appbar h1{font-size:var(--fs-lg);font-weight:650;letter-spacing:-.01em}
.appbar .sub{font-size:var(--fs-xs);color:var(--text-2);margin-top:1px}
.appbar-btn{
  margin-inline-start:auto;display:flex;align-items:center;gap:6px;
  min-height:40px;padding:0 12px;border-radius:var(--r-sm);
  background:var(--card);border:1px solid var(--line);
  font-size:var(--fs-sm);font-weight:550;transition:background .15s ease,scale .1s ease;
}
.appbar-btn:active{scale:.96}
main{flex:1;padding:0 var(--page) 28px;display:flex;flex-direction:column;gap:16px}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:sticky;bottom:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 4px 10px;min-height:58px;color:var(--text-3);
  font-size:var(--fs-xs);font-weight:550;transition:color .15s ease;
}
.tab svg{width:24px;height:24px;display:block}
.tab[aria-selected="true"]{color:var(--brand)}
.tab:active{scale:.96}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h2{font-size:var(--fs-md);font-weight:620;letter-spacing:-.005em}
.card-h .right{margin-inline-start:auto;font-size:var(--fs-sm);color:var(--text-2)}
.sec-title{font-size:var(--fs-sm);font-weight:600;color:var(--text-2);padding:2px 4px 0}

/* ---------- 首页：热量圆环 + 碳蛋脂 ---------- */
.energy{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:210px;min-width:210px;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
.ring .track{fill:none;stroke:var(--line-2);stroke-width:12}
.ring .prog{
  fill:none;stroke:var(--brand);stroke-width:12;stroke-linecap:round;
  transition:stroke-dashoffset .55s cubic-bezier(.2,0,0,1),stroke .25s ease;
}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;
}
.ring-eat{font-size:var(--fs-hero);font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-unit{font-size:var(--fs-xs);color:var(--text-2);margin-top:4px}
.ring-left{font-size:var(--fs-xs);color:var(--text-2);margin-top:8px}
.ring-left b{color:var(--brand);font-weight:650}

.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.macro-top{display:flex;align-items:baseline;gap:6px;font-size:var(--fs-xs)}
.macro-top .name{font-weight:600;display:flex;align-items:center;gap:5px}
.macro-top .dot{width:7px;height:7px;border-radius:50%}
.macro-top .g{margin-inline-start:auto;color:var(--text-2)}
.macro-top .pct{font-weight:650}
.bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,0,0,1)}
.bar.over>i{background:var(--danger)!important}

/* ---------- 三餐卡片 ---------- */
.meals{display:flex;flex-direction:column;gap:12px}
.meal{
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;
}
.meal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:start}
.meal-ico{font-size:19px;line-height:1;width:26px;text-align:center}
.meal-name{font-weight:600;font-size:var(--fs-md)}
.meal-sub{font-size:var(--fs-xs);color:var(--text-2);margin-top:1px}
.meal-kcal{margin-inline-start:auto;text-align:end;font-size:var(--fs-sm);font-weight:650}
.meal-kcal .of{display:block;font-size:var(--fs-xs);font-weight:450;color:var(--text-2)}
.meal-body{padding:0 16px 14px;border-top:1px solid var(--line-2);padding-top:12px}
.food-line{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:var(--fs-sm);flex-wrap:wrap}
.food-line .fn{flex:1;min-width:0}
.food-line .fa{color:var(--text-2);font-size:var(--fs-xs);white-space:nowrap}
.food-line .fk{font-weight:600;white-space:nowrap}
/* 每条食物的营养素：单独一行，小字灰字，不跟热量抢注意力 */
.food-line .fm{
  flex:0 0 100%;font-size:11px;color:var(--text-3);
  padding-inline-start:2px;margin-top:-1px;
}
/* 整餐合计的营养素 */
.meal-macros{
  font-size:var(--fs-xs);color:var(--text-2);
  padding:8px 2px 2px;border-top:1px dashed var(--line-2);margin-top:6px;
}
/* 还没记录时也要能一键用组合，所以这种 body 需要自己带上间距 */
.meal-body-combo{padding-top:10px}
.meal-empty{font-size:var(--fs-sm);color:var(--text-2);padding:2px 0}
.linkbtn{
  color:var(--brand);font-weight:600;font-size:var(--fs-sm);
  min-height:36px;display:inline-flex;align-items:center;gap:3px;
}
.linkbtn:active{opacity:.6}

/* ---------- 快捷记录按钮 ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:70px;border-radius:var(--r-md);background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:var(--fs-sm);font-weight:600;
  transition:scale .1s ease,background .15s ease;
}
.qbtn:active{scale:.96;background:var(--card-2)}
.qbtn .plus{font-size:19px;line-height:1;color:var(--brand)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:46px;padding:0 18px;border-radius:var(--r-md);
  font-size:var(--fs-md);font-weight:620;background:var(--card-2);color:var(--text);
  border:1px solid var(--line);transition:scale .1s ease,background .15s ease,opacity .15s ease;
}
.btn:active{scale:.96}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:0 13px;font-size:var(--fs-sm);border-radius:var(--r-sm)}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--fs-sm);font-weight:550;color:var(--text-2)}
.input{
  width:100%;min-height:46px;padding:10px 13px;border-radius:var(--r-md);
  background:var(--card-2);border:1px solid var(--line);
  font-size:16px;transition:border-color .15s ease,background .15s ease;
}
.input:focus{outline:none;border-color:var(--brand);background:var(--card)}
.input[type=search]{-webkit-appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:var(--fs-xs);color:var(--text-2)}
.err{font-size:var(--fs-xs);color:var(--danger)}

/* 分段选择器 */
.seg{display:flex;gap:6px;background:var(--card-2);border:1px solid var(--line);padding:4px;border-radius:var(--r-md)}
.seg button{
  flex:1;min-height:38px;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:550;
  color:var(--text-2);transition:background .15s ease,color .15s ease;
}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:620}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:0 0 auto;padding:0 12px}

/* 勾选行 */
.check{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 13px;border-radius:var(--r-md);
  background:var(--card-2);border:1px solid var(--line);width:100%;text-align:start}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-3);flex:0 0 auto;
  display:grid;place-items:center;transition:background .15s ease,border-color .15s ease}
.check[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.check .box svg{width:13px;height:13px;color:#fff;opacity:0;transition:opacity .15s ease}
.check[aria-pressed="true"] .box svg{opacity:1}
.check .t{flex:1;min-width:0}
.check .t b{display:block;font-weight:600;font-size:var(--fs-sm)}
.check .t span{display:block;font-size:var(--fs-xs);color:var(--text-2)}

/* ---------- 弹窗 / 抽屉 ---------- */
.mask{
  position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.42);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:maskin .18s ease-out;
}
@keyframes maskin{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:var(--maxw);background:var(--card);
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-lg);
  max-height:92dvh;display:flex;flex-direction:column;
  animation:sheetin .26s cubic-bezier(.2,0,0,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes sheetin{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line-2)}
.sheet-h h2{font-size:var(--fs-lg);font-weight:650}
.sheet-h .x{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--card-2);color:var(--text-2);font-size:18px;line-height:1}
.sheet-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px 16px;border-top:1px solid var(--line-2);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@media (min-width:640px){
  .mask{align-items:center;padding:24px}
  .sheet{border-radius:var(--r-lg);max-height:86dvh;max-width:560px}
}

/* ---------- 食物库列表 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);font-size:var(--fs-sm);font-weight:550;
  display:inline-flex;align-items:center;color:var(--text-2);transition:background .15s ease,color .15s ease;
}
.chip[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:#fff;font-weight:620}
.chip:active{scale:.96}
.flist{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.fitem{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line-2);width:100%;text-align:start;
  transition:background .12s ease}
.fitem:first-child{border-top:0}
.fitem:active{background:var(--card-2)}
.fitem .fi{flex:1;min-width:0}
.fitem .fname{font-size:var(--fs-sm);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fitem .fname .tag{font-size:11px;font-weight:500;color:var(--text-3);background:var(--card-2);border-radius:5px;padding:1px 5px}
.fitem .fnut{font-size:var(--fs-xs);color:var(--text-2);margin-top:2px}
.fitem .fkc{text-align:end;white-space:nowrap}
.fitem .fkc b{font-size:var(--fs-md);font-weight:700}
.fitem .fkc span{display:block;font-size:11px;color:var(--text-2)}
.kcal-u{font-size:11px;font-weight:500;color:var(--text-2)}

/* 数量选择 */
.qty{display:flex;align-items:center;gap:10px}
.qty .step{
  width:46px;height:46px;border-radius:var(--r-md);background:var(--card-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;font-weight:600;transition:scale .1s ease
}
.qty .step:active{scale:.94}
.qty input{flex:1;text-align:center;font-size:20px;font-weight:650;min-height:46px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets .chip{flex:1}
.summary{background:var(--card-2);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.summary .big{display:flex;align-items:baseline;gap:6px}
.summary .big b{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em}
.summary .macros3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.summary .macros3 div{font-size:var(--fs-xs);color:var(--text-2)}
.summary .macros3 b{display:block;font-size:var(--fs-md);color:var(--text);font-weight:650}

/* ---------- 数据行 ---------- */
.kv{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line-2)}
.kv:first-child{border-top:0;padding-top:0}
.kv .k{font-size:var(--fs-sm);color:var(--text-2)}
.kv .v{margin-inline-start:auto;font-weight:650;font-size:var(--fs-md);white-space:nowrap}
.kv .v small{font-weight:450;color:var(--text-2);font-size:var(--fs-xs);margin-inline-start:2px}
.kv.big .v{font-size:var(--fs-lg);color:var(--brand)}

/* ---------- 图表 ---------- */
.chart-wrap{position:relative;width:100%}
canvas{display:block;width:100%}
.chart-legend{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--text-2);margin-top:8px}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.trend{background:var(--card-2);border-radius:var(--r-md);padding:11px 13px;font-size:var(--fs-sm);margin-top:12px;line-height:1.45}
.trend b{font-weight:700}
.trend.good b{color:var(--good)}
.trend.warn b{color:var(--fat)}

/* 空状态 */
.empty{text-align:center;padding:26px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ico{font-size:30px;line-height:1}
.empty b{font-size:var(--fs-md);font-weight:620}
.empty p{font-size:var(--fs-sm);color:var(--text-2);max-width:34ch;text-wrap:pretty}

/* 提示条 */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  background:#1B1E24;color:#fff;border-radius:999px;padding:10px 18px;font-size:var(--fs-sm);font-weight:550;
  box-shadow:var(--shadow-lg);animation:toastin .22s cubic-bezier(.2,0,0,1);
  max-width:min(92vw,420px);text-align:center;text-wrap:pretty;
}
@media (prefers-color-scheme: dark){.toast{background:#F2F3F5;color:#101216}}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:toastout .2s ease-in forwards}
@keyframes toastout{to{transform:translateY(6px);opacity:0}}

/* 施工中标签 */
.wip{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--text-2);
  background:var(--card-2);border-radius:var(--r-sm);padding:9px 12px}

/* 设置向导 */
.steps{display:flex;gap:5px;padding:0 16px}
.steps i{height:3px;flex:1;border-radius:99px;background:var(--line);transition:background .25s ease}
.steps i.on{background:var(--brand)}
.wiz-title{font-size:var(--fs-xl);font-weight:680;letter-spacing:-.02em;text-wrap:balance}
.wiz-sub{font-size:var(--fs-sm);color:var(--text-2);text-wrap:pretty}

/* ---------- 训练：今日计划大卡片 ---------- */
.hero-plan{
  background:linear-gradient(160deg, color-mix(in srgb,var(--brand) 92%, #fff) 0%, var(--brand) 100%);
  color:#fff; border-radius:var(--r-lg); padding:26px 20px 20px;
  box-shadow:0 18px 40px -18px color-mix(in srgb,var(--brand) 70%, transparent);
  display:flex; flex-direction:column; gap:8px; text-align:center;
  transition:background .3s ease;
}
.hero-plan.finished{background:linear-gradient(160deg,#16A34A,#15803D);box-shadow:0 18px 40px -18px rgba(21,128,61,.6)}
.hero-plan.empty{background:var(--card);color:var(--text);box-shadow:var(--shadow);border:1px dashed var(--line)}
/* 注意：letter-spacing 会在最后一个字后面也加空隙，把末尾字推出父容器被裁掉，
   所以这里用「字间空格 + 轻微字距」，并且左边补一个等宽的空位保持视觉居中。 */
.hero-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-indent:.06em;opacity:.82;padding-inline:4px}
.hero-title{
  font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em;line-height:1.25;
  text-wrap:balance;margin:2px 0;
}
.hero-meta{font-size:var(--fs-sm);opacity:.9}
.hero-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin:6px 0 4px}
.hero-bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .5s cubic-bezier(.2,0,0,1)}
.hero-plan.empty .hero-bar{display:none}
.hero-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.hero-plan .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;min-height:44px}
.hero-plan .btn.primary{background:#fff;color:var(--brand);border-color:transparent}
.hero-plan.empty .btn{background:var(--brand);color:#fff;border-color:transparent}
.hero-done{font-size:var(--fs-sm);font-weight:600;padding:10px;border-radius:var(--r-md);background:rgba(255,255,255,.18)}
.hero-hint{
  font-size:var(--fs-xs);line-height:1.5;margin-top:4px;padding:8px 10px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.16);text-wrap:pretty;
}
.hero-hint .linkbtn{color:#fff;text-decoration:underline;font-size:var(--fs-xs);min-height:0;margin-inline-start:4px}

/* 动作清单 */
.exlist{display:flex;flex-direction:column;gap:10px}
.ex{
  display:flex;gap:12px;align-items:flex-start;background:var(--card);
  border-radius:var(--r-md);box-shadow:var(--shadow);padding:13px 14px;
  transition:opacity .2s ease;
}
.ex.done{opacity:.62}
.ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--text-3);text-decoration-thickness:1.5px}
.ex-check{flex:0 0 auto;padding:2px 0 0;min-width:26px;min-height:26px}
.ex-check .box{
  width:22px;height:22px;border-radius:7px;border:1.6px solid var(--text-3);
  display:grid;place-items:center;background:var(--card);
  transition:background .15s ease,border-color .15s ease,scale .1s ease;
}
.ex-check:active .box{scale:.9}
.ex-check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.ex-check .box svg{width:14px;height:14px;color:#fff;opacity:0;transition:opacity .15s ease}
.ex-check[aria-pressed="true"] .box svg{opacity:1}
.ex-main{flex:1;min-width:0}
.ex-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ex-name{font-size:var(--fs-md);font-weight:600;line-height:1.35}
.ex-spec{font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap}
.ex-note{
  font-size:var(--fs-sm);color:var(--text-2);margin-top:6px;line-height:1.45;
  background:var(--card-2);border-radius:var(--r-xs);padding:7px 10px;text-wrap:pretty;
}
.ex-actions{display:flex;gap:14px;margin-top:4px}
.ex-actions .linkbtn{min-height:26px;font-size:var(--fs-xs);color:var(--text-3)}
.ex-actions .linkbtn:active{color:var(--brand)}

/* 计划列表 */
.plan-list{display:flex;flex-direction:column;gap:8px}
.plan-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  padding:12px 14px;border-radius:var(--r-md);background:var(--card-2);
  border:1px solid var(--line);transition:background .15s ease,border-color .15s ease,scale .1s ease;
}
.plan-item:active{scale:.98}
.plan-item.on{border-color:var(--brand);background:var(--brand-soft)}
.pi-main{flex:1;min-width:0}
.pi-name{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;flex-wrap:wrap}
.pi-name .tag{font-size:11px;font-weight:500;color:var(--text-3);background:var(--card);border-radius:5px;padding:1px 5px}
.pi-act{font-size:var(--fs-xs);color:var(--brand);font-weight:600;white-space:nowrap}
.plan-item.on .pi-act{color:var(--text-2)}

/* 每周排期 */
.sched{display:flex;flex-direction:column;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.sched-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  padding:12px 14px;background:var(--card);border-top:1px solid var(--line-2);min-height:48px;
  transition:background .15s ease;
}
.sched-row:first-child{border-top:0}
.sched-row:active{background:var(--card-2)}
.sr-day{font-size:var(--fs-sm);font-weight:600;flex:0 0 44px;color:var(--text-2)}
.sr-val{flex:1;min-width:0;font-size:var(--fs-sm);font-weight:550}
.sr-val.empty{color:var(--text-3);font-weight:450}
.sr-chev{color:var(--text-3);display:flex}

/* 动作编辑行 */
.ex-editor{display:flex;flex-direction:column;gap:10px}
.ex-edit-row{
  display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);
  background:var(--card-2);border:1px solid var(--line);
}
.ex-edit-row .top{display:flex;gap:8px;align-items:center}
.ex-edit-row .top .input{flex:1}
.ex-edit-row .nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ex-edit-row .nums .field label{font-size:11px}
.ex-edit-row .nums .input{min-height:40px;font-size:14px;padding:8px 10px}
.mini-x{
  flex:0 0 auto;width:34px;height:34px;border-radius:var(--r-sm);background:var(--card);
  border:1px solid var(--line);color:var(--text-3);display:grid;place-items:center;font-size:15px;
}
.mini-x:active{scale:.94;color:var(--danger)}
textarea.input{min-height:110px;resize:vertical;font-size:14px;line-height:1.5;font-family:inherit}

/* ---------- 拍营养成分表 ---------- */
.photo-area{
  position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--card-2);
  border:1px solid var(--line);margin-bottom:16px;
}
.photo-area img{display:block;width:100%;max-height:220px;object-fit:cover}
.photo-area video{display:block;width:100%;max-height:300px;background:#000;object-fit:cover}
/* display:block 会压掉 hidden 的默认样式，必须显式让 hidden 生效（否则没开相机也有一条黑条） */
.photo-area video[hidden]{display:none}
.photo-cta{padding:20px 16px;text-align:center}
.photo-cta .pc-ico{font-size:28px;line-height:1}
.photo-cta b{display:block;font-size:var(--fs-sm);font-weight:620;margin-top:8px}
.photo-cta p{font-size:var(--fs-xs);color:var(--text-2);margin-top:6px;line-height:1.5;text-wrap:pretty}
.photo-cta .btn{margin-top:12px}
.photo-retake{
  position:absolute;inset-block-start:10px;inset-inline-end:10px;
  background:rgba(0,0,0,.62);color:#fff;border-radius:999px;padding:6px 14px;font-size:var(--fs-xs);font-weight:550;
  backdrop-filter:blur(6px);
}
.photo-retake:active{scale:.95}
.cam-bar{display:flex;gap:10px;padding:10px;background:var(--card-2);border-top:1px solid var(--line)}
.cam-bar[hidden]{display:none}   /* display:flex 会压掉 hidden，必须显式关掉 */
.cam-bar .btn{flex:1}

/* 每 100 克 / 每份 切换 */
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card-2);
  border:1px solid var(--line);border-radius:var(--r-md);padding:4px;margin-bottom:14px;
}
.seg button{
  padding:9px 8px;border-radius:calc(var(--r-md) - 3px);font-size:var(--fs-sm);font-weight:600;
  color:var(--text-2);transition:background .15s ease,color .15s ease;
}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}

/* 换算结果 */
.calc{
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 24%, transparent);
  border-radius:var(--r-md);padding:12px 14px;margin-top:4px;
}
.calc-h{font-size:var(--fs-xs);font-weight:600;color:color-mix(in srgb,var(--brand) 78%, var(--text));letter-spacing:.02em}
.calc-v{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:var(--fs-sm);color:var(--text-2)}
.calc-v b{color:var(--text);font-weight:650}
.calc-note{font-size:var(--fs-xs);color:var(--text-2);margin-top:8px;line-height:1.5;text-wrap:pretty}
.calc-warn{
  font-size:var(--fs-xs);color:#92400E;background:#FEF3C7;border-radius:var(--r-sm);
  padding:8px 10px;margin-top:10px;line-height:1.5;text-wrap:pretty;
}
@media (prefers-color-scheme: dark){
  .calc-warn{background:#3A2E12;color:#FCD34D}
}

/* ---------- 扫条码 ---------- */
.scan-line{
  position:absolute;inset-inline:0;inset-block-start:50%;height:2px;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);
  box-shadow:0 0 12px 2px color-mix(in srgb,var(--brand) 70%, transparent);
  animation:scanmove 2s ease-in-out infinite;
}
/* 这个元素靠 position 定位展示，没有显式 display，hidden 本来生效；
   显式写一条是为了以后有人给它加 display 时不会踩到同一个坑 */
.scan-line[hidden]{display:none}
@keyframes scanmove{
  0%,100%{inset-block-start:18%}
  50%{inset-block-start:82%}
}
@media (prefers-reduced-motion: reduce){ .scan-line{animation:none;inset-block-start:50%} }
.off-card{
  border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--card);
  margin-top:4px;
}
.off-head{display:flex;gap:12px;align-items:center}
.off-img{
  width:54px;height:54px;border-radius:var(--r-sm);object-fit:cover;flex:0 0 auto;background:var(--card-2);
}
.off-img-ph{display:grid;place-items:center;font-size:22px}
.off-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.off-txt b{font-size:var(--fs-sm);font-weight:620;line-height:1.35;text-wrap:pretty}
.off-rows{margin-top:8px;display:flex;flex-direction:column;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-2)}
.off-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card-2);
  border-top:1px solid var(--line-2);cursor:pointer;
}
.off-row:first-child{border-top:0}
.off-row input{width:17px;height:17px;accent-color:var(--brand);flex:0 0 auto}
.of-l{flex:1;font-size:var(--fs-sm);color:var(--text-2)}
.of-v{font-size:var(--fs-sm);font-weight:620}
.off-actions{display:flex;gap:10px;margin-top:12px}
.off-actions .btn{flex:1}

/* ---------- 我的：饮食调整大卡片 ---------- */
.hero-plan.adj{padding:24px 20px 18px}
.adj-kcal{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:2px 0}
.adj-kcal b{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.adj-kcal span{font-size:var(--fs-sm);opacity:.9}
.adj-macros{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);
  margin-top:6px;opacity:.95;
}
.adj-macros span{display:inline-flex;align-items:center;gap:5px}
.adj-macros i{width:6px;height:6px;border-radius:99px;display:inline-block;opacity:.75}
.adj-macros b{font-weight:650}
.adj-actions{display:flex;gap:10px;margin-top:12px}
.adj-actions .btn{flex:1;min-height:44px}
.hero-plan.adj .hero-hint{text-align:center;margin-top:10px}

/* 目标变化提示 */
.adj-diff{
  border-radius:var(--r-md);padding:12px 14px;font-size:var(--fs-sm);margin-top:12px;
  line-height:1.5;text-wrap:pretty;
}
.adj-diff b{font-size:var(--fs-md)}
.adj-diff span{color:var(--text-2)}
.adj-diff.down{background:var(--good-soft);color:var(--good-text)}
.adj-diff.up{background:var(--brand-soft);color:var(--text)}
.adj-diff.same{background:var(--card-2);color:var(--text-2)}

/* 漏记提醒：和普通提示区分开，因为它可以点 */
.missed-tip{
  width:100%;margin-top:10px;display:flex;align-items:center;gap:8px;
  background:var(--card-2);border:1px dashed color-mix(in srgb, var(--brand) 40%, transparent);
  border-radius:var(--r-md);padding:11px 13px;font-size:var(--fs-xs);
  color:var(--text-2);text-align:start;line-height:1.45;cursor:pointer;
}
.missed-tip:active{scale:.99}
.missed-tip .go{margin-inline-start:auto;color:var(--brand);font-weight:600;flex:0 0 auto}

/* ---------- 常吃组合 ---------- */
.combo-box{
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--card);padding:12px 13px;
}
.combo-box-h{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:var(--fs-xs);font-weight:620;color:var(--text-2);margin-bottom:8px;
}
.combo-chips{display:flex;flex-direction:column;gap:8px}
.combo-chip{
  display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;
  background:var(--card-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:9px 12px;cursor:pointer;
}
.combo-chip:active{scale:.99;border-color:var(--brand)}
.combo-chip b{font-size:var(--fs-sm);font-weight:620}
.combo-chip span{
  font-size:var(--fs-xs);color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
}
.combo-chip i{font-style:normal;font-size:11px;color:var(--brand);font-weight:600}
.combo-preview{
  border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:4px 12px;margin-top:12px;background:var(--card-2);
}
.combo-group{margin-bottom:16px}
.combo-group-h{font-size:var(--fs-xs);font-weight:650;color:var(--text-2);margin-bottom:6px}
.combo-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-top:1px solid var(--line-2);
}
.combo-row:first-of-type{border-top:0}
.combo-row .ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.combo-row .ci b{font-size:var(--fs-sm);font-weight:620}
.combo-row .ci span{font-size:var(--fs-xs);color:var(--text-2);line-height:1.45;text-wrap:pretty}

/* 无障碍 */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:560px){
  :root{--fs-hero:40px;--fs-xl:22px}
  .energy{flex-direction:column;align-items:stretch;gap:14px}
  .ring{width:206px;min-width:0;margin:0 auto}
  .ring-eat{font-size:40px}
  .macros{gap:10px}
}
</style>
</head>
<body>
<div id="app">
  <header class="appbar" id="appbar"><div class="appbar-in" id="appbarIn"></div></header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar" hidden><div class="tabbar-in" id="tabbarIn"></div></nav>
</div>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   1. 食物数据库（内嵌，来自《中国食物成分表标准版》）

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function r0(n) { return Math.round(Number(n) || 0); }
function r1(n) { return Math.round((Number(n) || 0) * 10) / 10; }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function fmtN(n) { return r0(n).toLocaleString('zh-CN'); }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseKey(k) { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function shiftKey(k, days) { const d = parseKey(k); d.setDate(d.getDate() + days); return dateKey(d); }
function weekdayCN(k) { return '日一二三四五六'[parseKey(k).getDay()]; }
function prettyDate(k) {
  const t = todayKey();
  if (k === t) return '今天';
  if (k === shiftKey(t, -1)) return '昨天';
  if (k === shiftKey(t, 1)) return '明天';
  const d = parseKey(k);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));

    foods: [],       // 我的自定义食物

    plans: [],       // 训练计划 [{ id, name, ex:[{id,name,sets,reps,weight,note,type}], rest, createdAt }]
    schedule: {},    // 排期 { '1': planId, ... '0': planId }，键是星期（0=周日）
    meta: { lastOpen: null },
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== 'object') return defaultState();
    const base = defaultState();
    return {
      ...base, ...obj,
      profile: { ...base.profile, ...(obj.profile || {}) },
      targets: { ...base.targets, ...(obj.targets || {}) },
      meta: { ...base.meta, ...(obj.meta || {}) },
      days: obj.days && typeof obj.days === 'object' ? obj.days : {},
      foods: Array.isArray(obj.foods) ? obj.foods : [],
      bodyLog: Array.isArray(obj.bodyLog) ? obj.bodyLog : [],
      recent: Array.isArray(obj.recent) ? obj.recent : [],
      combos: Array.isArray(obj.combos) ? obj.combos : [],
      plans: Array.isArray(obj.plans) ? obj.plans.map(normalizePlan) : [],
      schedule: obj.schedule && typeof obj.schedule === 'object' ? obj.schedule : {},
    };
  } catch (e) {
    console.warn('读取数据失败', e);
    return defaultState();
  }
}

  try {

/* 天数读写 */
function dayOf(dateKeyStr, create) {
  if (!S.days[dateKeyStr] && create) S.days[dateKeyStr] = { meals: {} };
  return S.days[dateKeyStr] || { meals: {} };
}
function entriesOf(dateKeyStr, mealId) {
  const d = S.days[dateKeyStr];
  return (d && d.meals && d.meals[mealId]) || [];
}
function dayTotals(dateKeyStr) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  const d = S.days[dateKeyStr];
  if (!d || !d.meals) return t;
  for (const list of Object.values(d.meals)) {
    for (const e of list) { t.kcal += e.kcal || 0; t.p += e.p || 0; t.f += e.f || 0; t.c += e.c || 0; }
  }
  return t;
}
function mealTotals(dateKeyStr, mealId) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  for (const e of entriesOf(dateKeyStr, mealId)) { t.kcal += e.kcal || 0; t.p += e.p || 0; t.f += e.f || 0; t.c += e.c || 0; }
  return t;
}

function pushRecent(name) {
  S.recent = [name, ...S.recent.filter((n) => n !== name)].slice(0, 20);
}

/* 添加一条记录：营养值在此刻快照保存，之后食物库变化也不影响历史 */
function addEntry(dateKeyStr, mealId, food, grams, unit) {
  const g = Math.max(1, Number(grams) || 100);
  const k = g / 100;
  const entry = {
    id: uid(),
    name: food.name,
    grams: r0(g),
    // 牛奶、饮料按毫升记，不然显示"250g 牛奶"很别扭
    unit: unit === 'ml' ? 'ml' : 'g',
    cat: food.cat || '其他',
    kcal: r0((food.kcal || 0) * k),
    p: r1((food.p || 0) * k),
    f: r1((food.f || 0) * k),
    c: r1((food.c || 0) * k),
  };
  const d = dayOf(dateKeyStr, true);
  if (!d.meals) d.meals = {};
  if (!d.meals[mealId]) d.meals[mealId] = [];
  d.meals[mealId].push(entry);
  pushRecent(food.name);
  saveState();
  return entry;
}
function removeEntry(dateKeyStr, mealId, entryId) {
  const d = S.days[dateKeyStr];
  if (!d || !d.meals || !d.meals[mealId]) return;
  d.meals[mealId] = d.meals[mealId].filter((e) => e.id !== entryId);
  if (!d.meals[mealId].length) delete d.meals[mealId];
  saveState();
}

/* ---------- 训练数据 ---------- */
const WEEK_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

// 兼容老备份里结构不完整的计划
function normalizePlan(p) {
  const ex = (Array.isArray(p.ex) ? p.ex : []).map((e) =>
    typeof e === 'string'
      ? { id: uid(), name: e, sets: '', reps: '', weight: '' }
      : { id: e.id || uid(), name: String(e.name || ''), sets: e.sets ?? '', reps: e.reps ?? '', weight: e.weight ?? '' }
  ).filter((e) => e.name);
  return { id: p.id || uid(), name: String(p.name || '未命名计划'), ex, rest: !!p.rest, createdAt: p.createdAt || Date.now() };
}

function planById(id) { return S.plans.find((p) => p.id === id) || null; }

/* 某天的训练状态（打卡、备注），不存在则返回空结构 */
function trainOf(dateKeyStr) {
  const d = S.days[dateKeyStr];
  const t = (d && d.train) || {};
  return { planId: t.planId || null, done: Array.isArray(t.done) ? t.done : [], notes: t.notes || {} };
}
function trainDay(dateKeyStr, create) {
  if (!S.days[dateKeyStr] && create) S.days[dateKeyStr] = { meals: {} };
  const d = S.days[dateKeyStr];
  if (create && !d.train) d.train = { planId: null, done: [], notes: {} };
  return d;
}
/* 今天该练哪个：手动指定的优先，否则看每周排期 */
function planForToday(dateKeyStr) {
  const t = trainOf(dateKeyStr);
  if (t.planId) return planById(t.planId);
  const wd = String(parseKey(dateKeyStr).getDay());
  const id = S.schedule[wd];
  return id ? planById(id) : null;
}
/* 排期里原本安排的是什么（用于提示"你今天手动换了计划"） */
function scheduledFor(dateKeyStr) {
  const id = S.schedule[String(parseKey(dateKeyStr).getDay())];
  return id ? planById(id) : null;
}
/* 当天没有手动指定，就清掉，让它回到排期 */
function clearTodayPlan(dateKeyStr) {
  const d = S.days[dateKeyStr];
  if (d && d.train) { d.train.planId = null; saveState(); }
}
function setTodayPlan(dateKeyStr, planId) {
  const d = trainDay(dateKeyStr, true);
  if (!d.train) d.train = { planId: null, done: [], notes: {} };
  d.train.planId = planId;
  saveState();
}
function toggleExercise(dateKeyStr, exId, on) {
  const d = trainDay(dateKeyStr, true);
  if (!d.train) d.train = { planId: null, done: [], notes: {} };
  const set = new Set(d.train.done);
  if (on) set.add(exId); else set.delete(exId);
  d.train.done = [...set];
  saveState();
}
function setExerciseNote(dateKeyStr, exId, text) {
  const d = trainDay(dateKeyStr, true);
  if (!d.train) d.train = { planId: null, done: [], notes: {} };
  if (!d.train.notes) d.train.notes = {};
  const v = String(text || '').trim();
  if (v) d.train.notes[exId] = v; else delete d.train.notes[exId];
  saveState();
}
/* 训练总时长不必精确：按每动作 8 分钟粗估，仅用于给个概念 */
function estimateMinutes(plan) {
  if (!plan || !plan.ex.length) return 0;
  return plan.ex.reduce((sum, e) => sum + (/有氧|跑步|爬坡|跳绳|椭圆|单车/.test(e.name) ? 32 : 8), 0);
}

/* ============================================================
   4. 计算层：BMR / TDEE / 摄入目标 / 宏量分配
   ============================================================ */
function bmr(profile) {
  const { sex, age, height, weight } = profile;
  if (!age || !height || !weight) return null;
  // Mifflin-St Jeor 公式（目前公认最准的估算）
  const base = 10 * weight + 6.25 * height - 5 * age;
  return Math.round(sex === 'female' ? base - 161 : base + 5);
}
function activityK(id) { return (ACTIVITY.find((a) => a.id === id) || ACTIVITY[1]).k; }
function goalObj(id) { return GOALS.find((g) => g.id === id) || GOALS[1]; }

function calcTargets(profile, targets) {
  const b = bmr(profile);
  if (b == null) return null;
  const k = activityK(profile.activity);
  const tdee = Math.round(b * k);
  const g = goalObj(profile.goal);
  const base = Math.round(tdee * (1 - g.rate));
  // 安全下限：不低于基础代谢的 1.1 倍
  const floor = Math.round(b * 1.1);
  const target = Math.max(base, floor);
  const floored = target > base;
  // 训练日多吃 10%，休息日少吃 5%
  const trainDay = Math.round(target * 1.1);
  const restDay = Math.round(target * 0.95);
  const t = { ...targets };
  const sum = (t.carbs || 0) + (t.protein || 0) + (t.fat || 0);
  const pct = sum === 100 ? t : { carbs: 45, protein: 30, fat: 25 };
  const kcalP = Math.round((target * pct.protein) / 100);
  const kcalF = Math.round((target * pct.fat) / 100);
  const kcalC = Math.max(0, target - kcalP - kcalF);
  return {
    bmr: b, tdee, target, trainDay, restDay, floor, floored, deficit: tdee - target,
    macroPct: pct,
    macroG: { protein: Math.round(kcalP / 4), fat: Math.round(kcalF / 9), carbs: Math.round(kcalC / 4) },
  };
}

/* 宏量比例滑块的可达范围（保证三者都能占到合理空间） */
function macroRange(key, t) {
  const P = 10, F = 15, C = 25; // 各项百分比下限
  if (key === 'protein') return { min: P, max: 100 - F - C };
  if (key === 'fat') return { min: F, max: 100 - P - C };
  return { min: C, max: 100 - P - F };
}

let toastTimer = null;
function toast(msg) {
  const wrap = $('#toastWrap');
  // 最多同时显示 2 条：快速连点时不要糊住半个屏幕
  const live = [...wrap.querySelectorAll('.toast:not(.out)')];
  if (live.length >= 2) live.slice(0, live.length - 1).forEach((t) => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {

  }, 1900);
}

let modalStack = [];
function openSheet({ title, bodyHTML, footerHTML, onMount, onClose, hideClose }) {
  const root = $('#modalRoot');
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title || '')}">
      <div class="sheet-h">
        <h2>${esc(title || '')}</h2>
        ${hideClose ? '' : '<button class="x" data-close aria-label="关闭">✕</button>'}
      </div>
      <div class="sheet-b">${bodyHTML || ''}</div>
      ${footerHTML ? `<div class="sheet-f">${footerHTML}</div>` : ''}
    </div>`;
  root.appendChild(mask);
  const handle = { mask, close };
  modalStack.push(handle);
  // 注意：close() 之后 mask 已脱离文档，但同一次点击还会继续冒泡上来，
  // 此时 e.target.closest() 找不到任何东西，会被误判成"点了遮罩"再关一次，
  // 把紧接着打开的弹窗（比如存完食物后弹出的份量弹窗）连带关掉。用标志位挡掉。
  let closing = false;
  function close() {
    if (closing) return;
    closing = true;
    mask.remove();
    modalStack = modalStack.filter((m) => m !== handle);
    if (onClose) onClose();
  }
  mask.addEventListener('click', (e) => {
    if (closing) return;
    if (e.target === mask || e.target.closest('[data-close]')) close();
    else if (e.target.closest('[data-cancel]')) close();
  });
  if (onMount) onMount(mask, close);
  const focusable = mask.querySelector('input,button');
  if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 60);
  return { close, mask };
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close();
});

function confirmSheet({ title, message, confirmText = '确定', danger, onConfirm }) {
  openSheet({
    title,
    bodyHTML: `<p class="muted" style="font-size:var(--fs-sm);text-wrap:pretty">${esc(message)}</p>`,
    footerHTML: `<button class="btn ghost" data-cancel>取消</button>

    },
  });
}

/* ------------------------------------------------------------
   营养素文字片段
   ------------------------------------------------------------ */

/* 一条记录的营养素，压缩成一行：碳 12 · 蛋 8 · 脂 3.5 */
function entryMacroText(e) {
  return `碳 ${r1(e.c || 0)} · 蛋 ${r1(e.p || 0)} · 脂 ${r1(e.f || 0)}`;
}

/* 一整餐合计的营养素：碳水 62 · 蛋白 31 · 脂肪 14 g */
function mealMacroText(mt) {
  if (!(mt.kcal > 0)) return '';
  return `碳水 ${r1(mt.c)} · 蛋白 ${r1(mt.p)} · 脂肪 ${r1(mt.f)} g`;
}

/* 记录里的份量单位：新记录会带 unit，旧记录没有就按克 */
function entryUnit(e) {
  return e.unit === 'ml' ? 'ml' : 'g';
}

/* ------------------------------------------------------------
   常吃组合：把一餐的几样东西存成一套，下次一键记完
   ------------------------------------------------------------ */

/* 某个餐次下的组合，最近用的排前面 */
function combosOf(mealId) {
  return (S.combos || [])
    .filter((c) => c.meal === mealId)
    .sort((a, b) => String(b.lastUsed || '').localeCompare(String(a.lastUsed || '')) || String(a.name).localeCompare(String(b.name)));
}

/* 组合里所有东西合起来的热量和营养素 */
function comboTotal(c) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  for (const it of c.items) {
    t.kcal += it.kcal || 0; t.p += it.p || 0; t.f += it.f || 0; t.c += it.c || 0;
  }
  return t;
}

/* 首页餐次卡片里的组合快捷按钮 */
function comboChipsHTML(mealId) {
  const list = combosOf(mealId);
  if (!list.length) return '';
  return `<div class="combo-chips">
    ${list.slice(0, 4).map((c) => {
      const t = comboTotal(c);
      return `<button class="combo-chip" data-apply-combo="${c.id}">
        <b>${esc(c.name)}</b><span class="num">${esc(c.items.map((i) => i.name).join('、'))}</span><i class="num">${fmtN(t.kcal)} 千卡</i>
      </button>`;
    }).join('')}
  </div>`;
}

/* 一键把整套记进这一餐 */
function applyCombo(comboId) {
  const c = (S.combos || []).find((x) => x.id === comboId);
  if (!c) return;
  const m = MEALS.find((x) => x.id === c.meal) || MEALS[0];
  const exist = new Set(entriesOf(UI.date, c.meal).map((e) => e.name + '|' + e.grams));
  let added = 0, skipped = 0;
  for (const it of c.items) {
    // 同样的东西、同样的份量已经有了就跳过，避免点两下变成两份
    if (exist.has(it.name + '|' + it.grams)) { skipped++; continue; }
    const d = dayOf(UI.date, true);
    if (!d.meals) d.meals = {};
    if (!d.meals[c.meal]) d.meals[c.meal] = [];
    d.meals[c.meal].push({
      id: uid(), name: it.name, grams: it.grams, unit: it.unit || 'g', cat: '其他',
      kcal: it.kcal || 0, p: it.p || 0, f: it.f || 0, c: it.c || 0,
    });
    exist.add(it.name + '|' + it.grams);
    added++;
  }
  c.lastUsed = todayKey();
  if (added) { for (const it of c.items) pushRecent(it.name); }
  saveState();
  const t = mealTotals(UI.date, c.meal);
  if (!added) {
    toast(`「${c.name}」里的东西${m.name}已经有了`);
  } else {
    toast(`${m.name}已加入 ${added} 项${skipped ? `，跳过重复的 ${skipped} 项` : ''} · 现在 ${fmtN(t.kcal)} 千卡`);
  }
  rerender();
}

/* ------------------------------------------------------------
   首页辅助：漏记提醒 + 近 7 天小结
   ------------------------------------------------------------ */

/* 按现在的时间，判断哪一餐"早该记了却没记"。
   只提醒已经过去的餐，而且不一次列一堆，只说最该说的那一句。 */
function missedMealTip(dateKeyStr) {
  if (dateKeyStr !== todayKey()) return null;
  const h = new Date().getHours();
  const missed = [];
  for (const m of MAIN_MEALS) {
    const filled = entriesOf(dateKeyStr, m.id).length > 0;
    if (filled) continue;
    if (h >= m.lateHour) missed.push(m);
  }
  if (!missed.length) return null;
  const names = missed.map((m) => m.name).join('、');
  return {
    // 跳到"最近刚过去的那一顿"：漏了早餐的人，多半更想先补午餐
    meal: missed[missed.length - 1].id,
    text: missed.length === 1
      ? `${names}还没记 —— 忘了记的话，现在补上也来得及`
      : `${names}都还没记 —— 一次补完也行`,
  };
}

/* 近 7 天（含今天）：平均吃了多少、记了几天、几天在目标附近 */
/* 记录少于这个热量的一天，基本可以断定是漏记而不是真的只吃这么点。
   漏记的天数不能算进平均值，更不能算成"达标"—— 否则会得出
   "5/7 天在目标内"这种自相矛盾的结论（漏记那天反而"达标"了）。 */
const THIN_DAY_KCAL = 400;

function weekStats() {
  const T = calcTargets(S.profile, S.targets);
  const target = T ? T.target : null;
  const all = [];
  for (let i = 0; i < 7; i++) {
    const k = shiftKey(todayKey(), -i);
    const t = dayTotals(k);
    all.push({ key: k, kcal: t.kcal, logged: t.kcal > 0 });
  }
  const logged = all.filter((d) => d.logged);
  if (!logged.length) return null;
  const thin = logged.filter((d) => d.kcal < THIN_DAY_KCAL).length;
  // 只拿"记录完整"的天算平均和达标率
  const solid = logged.filter((d) => d.kcal >= THIN_DAY_KCAL);
  const avg = solid.length ? solid.reduce((a, d) => a + d.kcal, 0) / solid.length : 0;
  const onTrack = target ? solid.filter((d) => Math.abs(d.kcal - target) <= target * 0.1).length : 0;
  return {
    loggedCount: logged.length,
    solidCount: solid.length,
    avg: Math.round(avg),
    onTrack,
    thin,
  };
}

function weekSummaryHTML() {
  const w = weekStats();
  if (!w) return '';
  const T = calcTargets(S.profile, S.targets);
  const target = T ? T.target : 0;
  const diff = target ? w.avg - target : 0;
  const diffCls = !target ? '' : Math.abs(diff) <= target * 0.1 ? 'good' : 'warn';
  const diffTxt = !target ? '' : Math.abs(diff) <= target * 0.03
    ? '基本贴着目标'
    : diff > 0
      ? `比目标多 <b>${fmtN(Math.abs(diff))}</b> 千卡`
      : `比目标少 <b>${fmtN(Math.abs(diff))}</b> 千卡`;

  // 一天完整记录都没有时，别急着给"平均值"，先让用户把记录补上
  if (!w.solidCount) {
    return `
      <section class="card">
        <div class="card-h"><h2>近 7 天</h2><span class="right tiny muted">记了 ${w.loggedCount}/7 天</span></div>
        <div class="empty" style="padding:14px 0 4px">
          <b>这 7 天的记录都太少了</b>
          <p>每天记到差不多一整天的量，这里才会显示平均吃了多少。</p>
        </div>
      </section>`;
  }

  return `
    <section class="card">
      <div class="card-h"><h2>近 7 天</h2><span class="right tiny muted">记了 ${w.loggedCount}/7 天</span></div>
      <div class="kv big"><span class="k">平均每天</span><span class="v num">${fmtN(w.avg)}<small>千卡</small></span></div>
      <div class="tiny muted" style="margin-top:2px">按记录完整的 ${w.solidCount} 天算的</div>
      ${target ? `<div class="tiny muted ${diffCls}" style="margin-top:6px;line-height:1.5">${diffTxt}　·　${w.onTrack}/${w.solidCount} 天在目标上下 10% 以内</div>` : ''}
      ${w.thin ? `<div class="tiny muted" style="margin-top:6px;line-height:1.5;text-wrap:pretty">另有 ${w.thin} 天记录少于 ${THIN_DAY_KCAL} 千卡，多半是漏记了，没有算进平均。漏记会让平均值偏低，看着像"吃得很少"。</div>` : ''}
    </section>`;
}

function viewLog() {
  const q = UI.log.q.trim();
  const cat = UI.log.cat;
  let list;
  if (q) {
    const lq = q.toLowerCase();
    list = allFoods().filter((x) => x.name.toLowerCase().includes(lq) || (x.alias || '').toLowerCase().includes(lq));
    // 搜索时按相关度排：完全等于 > 名称以它开头 > 名称包含 > 只是别名里出现。
    // 否则会跟着食物库的分类顺序走，出现「搜鸡蛋，第一个是龙须面（鸡蛋）」这种结果。
    // 同样是"包含"，连续匹配的字符越多越相关：搜「面包」时，
    // 「面包」本身要排在只是碰巧含一个「面」字的「绿鳍马面鲀」前面。
    const runLen = (n) => {
      let best = 0;
      for (let i = 0; i < n.length; i++) {
        let j = 0;
        while (i + j < n.length && j < lq.length && n[i + j] === lq[j]) j++;
        if (j > best) best = j;
      }
      return best;
    };
    const rank = (x) => {
      const n = x.name.toLowerCase();
      if (n === lq) return 0;
      if (n.startsWith(lq)) return 1;
      if (n.includes(lq)) return 2;
      return 3;
    };
    list = list
      .map((x, i) => ({ x, r: rank(x), run: runLen(x.name.toLowerCase()), i }))
      // 名称里连续命中的字数越多越靠前，这个优先于"名称更短"
      .sort((a, b) => a.r - b.r || b.run - a.run || a.x.name.length - b.x.name.length || a.i - b.i)
      .map((o) => o.x);
  } else {
    list = cat === '全部' ? allFoods() : allFoods().filter((x) => x.cat === cat);
  }
  const matchedCount = list.length;
  list = list.slice(0, 120);

  const recents = S.recent.map((n) => findFood(n)).filter(Boolean).slice(0, 8);

  // 这一餐已经有东西了，就允许把它存成常吃组合
  const mealNow = MEALS.find((x) => x.id === UI.log.meal) || MEALS[0];
  const mealEntries = entriesOf(UI.date, UI.log.meal);
  const combos = combosOf(UI.log.meal);

  const comboBlock = (combos.length || mealEntries.length) ? `
    <div class="combo-box">
      <div class="combo-box-h">
        <span>🍱 ${mealNow.name}的常吃组合</span>
        <button class="linkbtn" data-manage-combos style="min-height:28px">管理</button>
      </div>
      ${combos.length ? `<div class="combo-chips">
        ${combos.map((c) => {
          const t = comboTotal(c);
          return `<button class="combo-chip" data-apply-combo="${c.id}">
            <b>${esc(c.name)}</b><span class="num">${esc(c.items.map((i) => i.name).join('、'))}</span><i class="num">${fmtN(t.kcal)} 千卡</i>
          </button>`;
        }).join('')}
      </div>` : `<div class="tiny muted" style="padding:0 2px 4px">还没有${mealNow.name}的组合。${mealEntries.length ? '把现在记的这几样存成一套，以后点一下就记好。' : '先在下面加几样食物，再回来存成组合。'}</div>`}
      ${mealEntries.length ? `<button class="btn sm ghost" data-save-combo style="width:100%;margin-top:8px">＋ 把${mealNow.name}当前的 ${mealEntries.length} 样存成组合</button>` : ''}
    </div>` : '';

  const rows = list.map((x) => `
    <button class="fitem" data-food="${esc(x.name)}">
      <span class="fi">
        <span class="fname">${esc(x.name)}${x.custom ? '<span class="tag">我的</span>' : ''}${x.note && x.note !== '代表值' ? `<span class="tag">${esc(x.note)}</span>` : ''}</span>
        <span class="fnut num">蛋白 ${r1(x.p)} · 脂肪 ${r1(x.f)} · 碳水 ${r1(x.c)} g</span>
      </span>
      <span class="fkc num"><b>${r0(x.kcal)}</b><span>千卡/100g</span></span>
    </button>`).join('');

  return `
    <div class="field">
      <input class="input" id="logSearch" type="search" placeholder="搜索食物，例如：鸡胸肉、米饭、牛奶"
        value="${esc(UI.log.q)}" autocomplete="off" enterkeyhint="search">
    </div>

    ${recents.length ? `
      <div>
        <div class="sec-title" style="padding-bottom:6px">最近记过</div>
        <div class="chips">${recents.map((x) => `<button class="chip" data-food="${esc(x.name)}">${esc(x.name)}</button>`).join('')}</div>
      </div>` : ''}

    ${comboBlock}

    <div class="chips">
      ${CATS.map((c) => `<button class="chip" data-cat="${c}" aria-pressed="${c === cat}">${c}</button>`).join('')}
    </div>

    <div style="display:flex;gap:10px">
      <button class="btn sm primary" data-photo style="flex:1.35">📷 拍营养成分表</button>
      <button class="btn sm ghost" data-mycustom style="flex:1">✎ 自己输</button>
      <button class="btn sm ghost" data-scan style="flex:1">▮▯ 扫条码</button>
    </div>

    <div class="tiny muted" style="padding:0 4px">共 ${matchedCount} 种食物${q ? `（搜索「${esc(q)}」）` : cat !== '全部' ? `（${cat}）` : ''}${matchedCount > list.length ? `，只显示最相关的前 ${list.length} 种，输入关键词可以更精确` : ''}</div>

    ${rows ? `<div class="flist">${rows}</div>`
      : `<div class="card"><div class="empty">
           <span class="ico">🔍</span>
           <b>没有找到「${esc(q)}」</b>
           <p>换个说法试试，比如只输入「鸡」或「面」；也可以点上面的「自定义食物」自己建一条。</p>
         </div></div>`}`;
}

function openQtySheet(food) {
  // 牛奶、饮料这类按毫升算更自然。除了看分类和名称，也看包装上**印的单位**：
  // 扫条码能拿到「净含量 250ml」这种原文，比猜名字准。
  const packText = food.pack || '';
  const isLiquid = /(^|\d\s*)(ml|毫升|l\b|升)/i.test(packText)
    || (food.cat === '乳品' && /奶|乳|饮|汁|水|豆浆/.test(food.name));
  const unit = isLiquid ? 'ml' : 'g';
  UI.log.food = food;
  let grams = UI.log.grams || 100;
  const presets = [50, 100, 150, 200, 250];

  function calc(g) {
    const k = g / 100;
    return { kcal: r0(food.kcal * k), p: r1(food.p * k), f: r1(food.f * k), c: r1(food.c * k) };
  }
  function body(g) {
    const v = calc(g);
    return `
      <div class="field">
        <label>份量</label>
        <div class="qty">
          <button class="step" data-step="-10" aria-label="减少">−</button>
          <input class="input" id="qtyInput" type="number" inputmode="decimal" min="1" max="3000" value="${r0(g)}">
          <button class="step" data-step="10" aria-label="增加">＋</button>
        </div>
        <div class="hint">单位：${unit}　·　手指一点就能改，也可以直接输入数字</div>
      </div>
      <div class="presets">
        ${presets.map((p) => `<button class="chip" data-preset="${p}" aria-pressed="${r0(g) === p}">${p}${unit}</button>`).join('')}
        ${food.cat === '主食' ? '<button class="chip" data-preset="150">一碗米饭≈150g</button>' : ''}
        ${food.cat === '肉禽蛋' ? '<button class="chip" data-preset="120">一个拳头≈120g</button>' : ''}
      </div>
      <div class="summary">
        <div class="big"><b class="num">${fmtN(v.kcal)}</b><span class="muted">千卡</span></div>
        <div class="macros3">
          <div><b class="num">${v.c}<span style="font-size:11px;font-weight:450"> g</span></b>碳水</div>
          <div><b class="num">${v.p}<span style="font-size:11px;font-weight:450"> g</span></b>蛋白</div>
          <div><b class="num">${v.f}<span style="font-size:11px;font-weight:450"> g</span></b>脂肪</div>
        </div>
      </div>`;
  }

  const sheet = openSheet({
    title: food.name,
    bodyHTML: body(grams),
    footerHTML: `<button class="btn ghost" data-cancel>取消</button>
                 <button class="btn primary" data-confirm>添加到${(MEALS.find((m) => m.id === UI.log.meal) || MEALS[0]).name}</button>`,
    onMount(mask, close) {
      const input = $('[id=qtyInput]', mask);
      const bodyEl = $('.sheet-b', mask);
      const refresh = (g) => {
        grams = clamp(g, 1, 3000);
        input.value = r0(grams);
        const summary = $('.summary', mask);
        const v = calc(grams);
        summary.querySelector('.big b').textContent = fmtN(v.kcal);
        const cells = summary.querySelectorAll('.macros3 b');
        cells[0].innerHTML = `${v.c}<span style="font-size:11px;font-weight:450"> g</span>`;
        cells[1].innerHTML = `${v.p}<span style="font-size:11px;font-weight:450"> g</span>`;
        cells[2].innerHTML = `${v.f}<span style="font-size:11px;font-weight:450"> g</span>`;
        $$('.presets .chip', mask).forEach((c) => c.setAttribute('aria-pressed', String(Number(c.dataset.preset) === r0(grams))));
      };
      $$('[data-step]', mask).forEach((b) => b.addEventListener('click', () => refresh(grams + Number(b.dataset.step))));
      $$('[data-preset]', mask).forEach((b) => b.addEventListener('click', () => refresh(Number(b.dataset.preset))));
      input.addEventListener('input', () => { const n = Number(input.value); if (Number.isFinite(n) && n > 0) refresh(n); });
      input.addEventListener('blur', () => refresh(Number(input.value) || 100));
      $('[data-confirm]', mask).addEventListener('click', () => {
        addEntry(UI.date, UI.log.meal, food, grams, unit);
        UI.log.grams = r0(grams);
        close();
        const m = MEALS.find((x) => x.id === UI.log.meal);
        toast(`已记入${m.name} · ${food.name} ${r0(grams)}${unit}`);
        go('home');
      });
    },
  });
  return sheet;
}

/* ============================================================
   8b. 拍营养成分表（P5-1）

/* 能不能调摄像头：无摄像头/被策略禁用时，界面直接退化成"照着包装填数字" */
function canCamera() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function openPhotoFoodSheet(opts) {
  const o = opts || {};
  const photoable = canCamera();
  let shot = null;        // 拍下来的照片 dataURL，只做「对照片填数字」的参照，不存进记录
  let per = '100';        // '100' = 每 100 克；'serve' = 每份
  let stream = null;
  // 扫条码查到的数据会传进来预填，用户核对/修改后再保存
  const pre = o.prefill || null;
  const val = (v) => (v === null || v === undefined || v === '' ? '' : String(r0(v)));
  // 定义在外层：onClose 和 onMount 都要用（写在 onMount 里的话 onClose 取不到）
  function stopCam() {

  const bodyHTML = () => `
    <div class="photo-area" id="photoArea">

          : `<div class="photo-cta">
               <div class="pc-ico">🔢</div>
               <b>照着包装背面的营养成分表填下面的数字</b>
               <p>这个浏览器不给摄像头权限，直接照着包装填就行，一样能存成你自己的食物。</p>
