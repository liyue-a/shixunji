      <video id="camVideo" playsinline muted hidden></video>
      <div class="cam-bar" id="camBar" hidden>
        <button class="btn sm" data-shoot type="button">拍下</button>
        <button class="btn sm ghost" data-stop type="button">取消</button>
      </div>
    </div>

    <div class="field"><label for="pfName">这个食品叫什么</label>
      <input class="input" id="pfName" placeholder="例如：某某牌全麦吐司" autocomplete="off" value="${pre ? esc(pre.name || '') : ''}"></div>

    ${pre && pre.fromLabel ? (pre.hasNutrition
      ? `<div class="hint" style="margin:-6px 0 12px;text-wrap:pretty">数据来自${esc(pre.fromLabel)}，是网友填进公开数据库的，<b>请对着包装核对一遍</b>再保存。</div>`
      : `<div class="hint" style="margin:-6px 0 12px;text-wrap:pretty">${esc(pre.fromLabel)}在数据库里只有商品名，名字已经帮你填好了，营养数字照着包装补上。</div>`) : ''}

    <div class="seg" id="pfPer">
      <button type="button" data-per="100" class="on">每 100 克</button>
      <button type="button" data-per="serve">每份</button>
    </div>

    <div class="field" id="pfServeWrap" hidden>
      <label for="pfServe">一份有多重（克）</label>
      <input class="input" id="pfServe" inputmode="decimal" placeholder="看包装上「净含量 / 每份」">
      <div class="hint">包装写「每份 30g」就在这里填 30。没有写「每份」就切回左边的「每 100 克」。</div>
    </div>

    <div class="row2">
      <div class="field"><label for="pfK">热量</label>
        <input class="input" id="pfK" inputmode="decimal" placeholder="千卡 kcal" value="${pre ? val(pre.kcal) : ''}"></div>
      <div class="field"><label for="pfP">蛋白质 (g)</label>
        <input class="input" id="pfP" inputmode="decimal" placeholder="克" value="${pre ? val(pre.p) : ''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="pfF">脂肪 (g)</label>
        <input class="input" id="pfF" inputmode="decimal" placeholder="克" value="${pre ? val(pre.f) : ''}"></div>
      <div class="field"><label for="pfC">碳水化合物 (g)</label>
        <input class="input" id="pfC" inputmode="decimal" placeholder="克" value="${pre ? val(pre.c) : ''}"></div>
    </div>

    <div class="field"><label for="pfCat">分类</label>
      <select class="input" id="pfCat">${CATS.slice(1).map((c) => `<option${c === '其他' ? ' selected' : ''}>${c}</option>`).join('')}</select></div>

    <div id="pfPreview"></div>
    <div class="err" id="pfErr" hidden></div>`;

  openSheet({
    title: pre && pre.barcode ? '核对商品数据' : '拍营养成分表',
    bodyHTML: bodyHTML(),
    footerHTML: `<button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-ok>存成我的食物</button>`,
    onClose() { stopCam(); },
    onMount(mask, close) {
      const bodyEl = $('.sheet-b', mask);
      const $id = (id) => $('#' + id, mask);
      const num = (id) => {
        const v = $id(id) ? $id(id).value.trim() : '';
        if (v === '') return null;
        const n = Number(v);
        return Number.isFinite(n) && n >= 0 ? n : null;
      };

      /* 把界面上的输入换算成「每 100 克」 */
      function toPer100() {
        const ratio = per === '100' ? 1 : (() => {
          const g = num('pfServe');
          return g && g > 0 ? 100 / g : null; // 每份 g 克 → 乘这个得到每 100 克
        })();
        return {
          ratio,
          kcal: num('pfK') === null ? null : (ratio === null ? num('pfK') : num('pfK') * ratio),
          p: num('pfP') === null ? null : (ratio === null ? num('pfP') : num('pfP') * ratio),
          f: num('pfF') === null ? null : (ratio === null ? num('pfF') : num('pfF') * ratio),
          c: num('pfC') === null ? null : (ratio === null ? num('pfC') : num('pfC') * ratio),
        };
      }

      function renderPreview() {
        const box = $id('pfPreview');
        const v = toPer100();
        const err = $id('pfErr');
        // 每份模式下还没填重量时，先不报错，只是不显示换算
        if (v.ratio === null) {
          box.innerHTML = '<div class="hint">填上一份的重量，我来帮你换成每 100 克。</div>';
          if (err.textContent === '请先填一份有多重（克）') err.hidden = true;
          return;
        }
        if (v.kcal === null && v.p === null && v.f === null && v.c === null) { box.innerHTML = ''; return; }
        const f1 = (x) => (x === null ? '—' : r1(x));
        let html = `<div class="calc">`;
        html += `<div class="calc-h">存起来是「每 100 克」：</div>`;
        html += `<div class="calc-v num">
          <span><b>${v.kcal === null ? '—' : r0(v.kcal)}</b> 千卡</span>
          <span>蛋白 <b>${f1(v.p)}</b>g</span>
          <span>脂肪 <b>${f1(v.f)}</b>g</span>
          <span>碳水 <b>${f1(v.c)}</b>g</span>
        </div>`;
        if (per !== '100' && (v.kcal !== null || v.p !== null)) {
          html += `<div class="calc-note">这是把「每份」换算过来的，以后按克数记录会自动算对。</div>`;
        }
        // 明显填错时提醒（数据源里也有这种问题，用户输入更常见）
        const macroKcal = 4 * (v.p || 0) + 9 * (v.f || 0) + 4 * (v.c || 0);
        // 三个营养素都填了才判对不上；少填一个时差值是必然的，提醒只会误导
        const allMacros = v.p !== null && v.f !== null && v.c !== null;
        if (allMacros && v.kcal !== null && v.kcal > 0 && macroKcal > 0) {
          const dev = Math.abs(macroKcal - v.kcal) / v.kcal;
          if (dev > 0.35) {
            html += `<div class="calc-warn">⚠️ 按碳蛋脂算出来约 ${r0(macroKcal)} 千卡，和你填的 ${r0(v.kcal)} 千卡差得有点多。
              包装上可能是「每份」而你选了「每 100 克」，或者数字抄错了一位。不影响保存，但结果会不准。</div>`;
          }
        }
        html += `</div>`;
        box.innerHTML = html;
      }

      // 首次挂载就先算一遍（扫条码预填的场景要立刻看到换算结果）
      renderPreview();

      // 每 100 克 / 每份 切换
      $$('[data-per]', mask).forEach((b) => b.addEventListener('click', () => {
        per = b.dataset.per;
        $$('[data-per]', mask).forEach((x) => x.classList.toggle('on', x === b));
        $id('pfServeWrap').hidden = per === '100';
        renderPreview();
        if (per === 'serve') setTimeout(() => { const s = $id('pfServe'); if (s && !s.value) s.focus(); }, 30);
      }));
      ['pfK', 'pfP', 'pfF', 'pfC', 'pfServe'].forEach((id) => {
        const el = $id(id);
        if (el) el.addEventListener('input', renderPreview);
      });

      function fallbackPhotoArea(msg) {
        const area = $id('photoArea');
        if (!area) return;
        area.classList.remove('live');
        area.innerHTML = `<div class="photo-cta">
          <div class="pc-ico">🔢</div>
          <b>${msg}</b>
          <p>照着包装背面的营养成分表填下面的数字就行，一样能存成你自己的食物。</p>
        </div>`;
      }

      /* ---- 相机 ---- */
      function bindCam() {
        const cam = $('[data-cam]', mask);
        if (cam) cam.addEventListener('click', async () => {
          const video = $id('camVideo');
          cam.disabled = true;
          cam.textContent = '正在打开…';
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.hidden = false;
            await video.play();
            $id('camBar').hidden = false;
            $id('photoArea').classList.add('live');
          } catch (e) {
            // 没摄像头、没给权限、或非 https —— 都退化成纯手填，别让用户以为坏了
            cam.disabled = false;
            cam.textContent = '打开相机';
            toast('打不开相机，直接照着包装填数字就行');
            fallbackPhotoArea('打不开相机，照着包装填下面的数字吧');
          }
        });
        const shoot = $('[data-shoot]', mask);
        if (shoot) shoot.addEventListener('click', () => {
          const video = $id('camVideo');
          const cv = document.createElement('canvas');
          cv.width = video.videoWidth || 720;
          cv.height = video.videoHeight || 540;
          cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
          shot = cv.toDataURL('image/jpeg', 0.8);
          stopCam();
          // 只重绘照片区，不重绘整个表单（否则已填的数字会丢）
          const area = $id('photoArea');
          area.classList.remove('live');
          area.innerHTML = `<img src="${shot}" alt="刚拍下的营养成分表"><button class="photo-retake" data-retake type="button">重拍</button>`;
          area.querySelector('[data-retake]').addEventListener('click', () => {
            shot = null;
            area.classList.remove('live');
            area.innerHTML = `<div class="photo-cta">
               <div class="pc-ico">📷</div>
               <b>对着包装背面的营养成分表拍照</b>
               <p>拍下来照着填下面的数字，比来回翻包装方便</p>
               <button class="btn sm primary" data-cam type="button">打开相机</button>
             </div>`;
            bindCam();
          });
          toast('拍好了，照着照片填下面的数字');
        });
        const stop = $('[data-stop]', mask);
        if (stop) stop.addEventListener('click', () => {
          stopCam();
          $id('camVideo').hidden = true;
          $id('camBar').hidden = true;
          $id('photoArea').classList.remove('live');
        });
      }
      bindCam();

      /* ---- 保存 ---- */
      $('[data-ok]', mask).addEventListener('click', () => {
        const err = $id('pfErr');
        const show = (m) => { err.hidden = false; err.textContent = m; };
        const name = $id('pfName').value.trim();
        if (!name) {
          show('先给这个食品起个名字，方便以后搜索');
          $id('pfName').focus();
          return;
        }
        const rawK = num('pfK');
        if (rawK === null) {
          show('热量是必填的，看包装上的「能量」那一行');
          $id('pfK').focus();
          return;
        }
        if (per === 'serve') {
          const g = num('pfServe');
          if (!g || g <= 0) { show('请先填一份有多重（克）'); $id('pfServe').focus(); return; }
        }
        const v = toPer100();
        const food = {
          id: uid(), name,
          cat: $id('pfCat').value,
          kcal: r0(v.kcal),
          p: r1(v.p || 0),
          f: r1(v.f || 0),
          c: r1(v.c || 0),
          alias: '',
          note: '我的',
          barcode: (pre && pre.barcode) || '',
          // 包装原文（如「净含量 250ml」），用来判断按毫升还是按克记录
          pack: (pre && pre.pack) || '',
          custom: true,
        };
        const exist = S.foods.findIndex((x) => x.name === name);
        if (exist >= 0) S.foods[exist] = food;
        else S.foods.push({ ...food });
        saveState();
        err.hidden = true;
        close();
        toast(exist >= 0 ? `已更新「${name}」` : `已存进「我的食物」：${name}`);
        openQtySheet(findFood(name) || food);
      });
    },
  });
}

/* ============================================================
   8c. 扫条码（P5-2）
   手机扫包装条码 → 联网查营养数据 → 核对后存成「我的食物」。
   查不到（国内食品常见）就直接转到「拍营养成分表」手填，不会卡住。
   ============================================================ */

const OFF_API = 'https://world.openfoodfacts.org/api/v2/product/';
const OFF_FIELDS = 'code,product_name,product_name_zh,brands,quantity,serving_size,nutriments,image_small_url';

/* 大部分浏览器没有原生条码识别能力，先探测再决定界面 */
function canScanBarcode() {
  return typeof BarcodeDetector !== 'undefined';
}

/* 条码只保留数字（扫码结果偶尔带空格或前缀） */
function cleanBarcode(s) {
  return String(s || '').replace(/[^\d]/g, '');
}

/* 校验常见条码长度：8 位 EAN-8、12 位 UPC-A、13 位 EAN-13 */
function barcodeLooksValid(code) {
  return code.length === 8 || code.length === 12 || code.length === 13;
}

/* Open Food Facts → 每 100 克营养（缺 kcal 时用千焦换算：1 kcal = 4.184 kJ） */
function parseOffProduct(p) {
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g'];
  if (kcal === undefined || kcal === null || kcal === '') {
    const kj = Number(n['energy_100g']);
    if (Number.isFinite(kj) && kj > 0) kcal = kj / 4.184;
  }
  const numOr = (v) => {
    const x = Number(v);
    return Number.isFinite(x) && x >= 0 ? x : null;
  };
  const name = (p.product_name_zh || p.product_name || '').trim();
  const brand = (p.brands || '').split(',')[0].trim();
  return {
    code: p.code || '',
    name,
    brand,
    fullName: [brand, name].filter(Boolean).join(' ').trim(),
    quantity: (p.quantity || '').trim(),
    serving: (p.serving_size || '').trim(),
    kcal: numOr(kcal),
    p: numOr(n.proteins_100g),
    f: numOr(n.fat_100g),
    c: numOr(n.carbohydrates_100g),
    image: p.image_small_url || '',
  };
}

async function fetchOffProduct(code) {
  const url = OFF_API + encodeURIComponent(code) + '.json?fields=' + OFF_FIELDS;
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 12000) : null;
  try {
    const res = await fetch(url, { headers: { Accept: 'application/json' }, signal: ctl ? ctl.signal : undefined });
    if (!res.ok) throw new Error('网络返回 ' + res.status);
    const j = await res.json();
    if (j.status !== 1 || !j.product) return null;
    return parseOffProduct(j.product);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function openScanSheet() {
  const scannable = canScanBarcode();
  let stream = null;
  let detector = null;
  let raf = 0;
  let busy = false;
  let lastCode = '';
  let tickStart = 0;

  function stopScan() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    detector = null;
  }

  openSheet({
    title: '扫条码',
    bodyHTML: `
      <div class="field">
        <label for="bcInput">包装上的条码数字</label>
        <input class="input num" id="bcInput" inputmode="numeric" autocomplete="off"
               placeholder="例如 6920202888883" style="letter-spacing:.08em;font-size:17px">
        <div class="hint">条形码下面那串数字，8～13 位。手输也行，扫不到时直接打数字。</div>
      </div>

      <div class="photo-area" id="scanArea">
        ${scannable
          ? `<div class="photo-cta">
               <div class="pc-ico">▮▯</div>
               <b>用相机对着包装条码</b>
               <p>对准后不用按快门，识别到会自动填上</p>
               <button class="btn sm primary" data-cam type="button">打开相机扫</button>
             </div>`
          : `<div class="photo-cta">
               <div class="pc-ico">⌨️</div>
               <b>这个浏览器不支持摄像头扫码</b>
               <p>把条码下面那串数字敲进上面的框里，一样能查得到。</p>
             </div>`}
        <video id="scanVideo" playsinline muted hidden></video>
        <div class="scan-line" id="scanLine" hidden></div>
        <div class="cam-bar" id="scanBar" hidden>
          <button class="btn sm ghost" data-stop type="button">停止</button>
        </div>
      </div>

      <div id="bcResult"></div>
      <div class="err" id="bcErr" hidden></div>`,
    footerHTML: `<button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-lookup>联网查询</button>`,
    onClose() { stopScan(); },
    onMount(mask, close) {
      const $id = (id) => $('#' + id, mask);
      const err = $id('bcErr');
      const result = $id('bcResult');
      const input = $id('bcInput');
      const show = (m) => { err.hidden = false; err.textContent = m; };
      const clearErr = () => { err.hidden = true; err.textContent = ''; };
      setTimeout(() => input.focus(), 80);

      /* ---- 查询并展示 ---- */
      async function lookup(code) {
        const c = cleanBarcode(code);
        if (!c) { show('先输入包装上的条码数字'); input.focus(); return; }
        if (!barcodeLooksValid(c)) { show('条码一般是 8、12 或 13 位数字，你输了 ' + c.length + ' 位，检查一下'); return; }
        clearErr();
        result.innerHTML = `<div class="calc"><div class="calc-h">正在联网查询 ${c} …</div>
          <div class="calc-note">国内食品在公开数据库里常常查不到，查不到我们就手填。</div></div>`;
        let found = null;
        try {
          found = await fetchOffProduct(c);
        } catch (e) {
          // 断网、超时、请求被拦：都别只说"失败"，给一条能走下去的路
          const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
          result.innerHTML = `
            <div class="calc">
              <div class="calc-h">${offline ? '现在没有网络' : '联网查询没成功'}</div>
              <div class="calc-note">${offline
                ? '扫条码要联网查公开数据库。断网时照样能记录 —— 点下面按钮照着包装填。'
                : '可能是网络不稳或查询超时（' + esc(String(e.message || e).slice(0, 30)) + '）。点下面按钮照着包装填，一样能存。'}</div>
            </div>
            <button class="btn sm ghost" data-tomanual type="button" style="width:100%;margin-top:10px">📷 改成照着包装填</button>`;
          const tm = $('[data-tomanual]', mask);
          if (tm) tm.addEventListener('click', () => { stopScan(); close(); openPhotoFoodSheet(); });
          return;
        }
        if (!found) {
          result.innerHTML = `
            <div class="calc">
              <div class="calc-h">没查到 ${c} 这个条码</div>
              <div class="calc-note">公开数据库里还没有这条记录（国内小品牌很常见）。点下面按钮照着包装填，一样能存成你的食物。</div>
            </div>
            <button class="btn sm ghost" data-tomanual type="button" style="width:100%;margin-top:10px">📷 改成照着包装填</button>`;
          const tm = $('[data-tomanual]', mask);
          if (tm) tm.addEventListener('click', () => { stopScan(); close(); openPhotoFoodSheet(); });
          return;
        }
        renderFound(found);
      }

      /* 查到结果：默认勾选，让用户核对后再导入（公开数据是众包的，可能不准） */
      function renderFound(f) {
        const chk = (k, label, val, unit) => `
          <label class="off-row">
            <input type="checkbox" data-off="${k}" checked>
            <span class="of-l">${label}</span>
            <span class="of-v num">${val === null ? '—' : r0(val)}${unit}</span>
          </label>`;
        // 名称行不是数字，单独一个版本
        const chkText = (k, innerHTML) => `
          <label class="off-row">
            <input type="checkbox" data-off="${k}" checked>
            <span class="of-l" style="display:flex;gap:6px;align-items:baseline;min-width:0">${innerHTML}</span>
          </label>`;
        const noNutri = f.kcal === null && f.p === null && f.f === null && f.c === null;
        const nameHTML = `名称 <b class="of-v">${esc(f.fullName || f.name || '未命名商品')}</b>`;
        result.innerHTML = `
          <div class="off-card">
            <div class="off-head">
              ${f.image ? `<img class="off-img" src="${esc(f.image)}" alt="" loading="lazy">` : '<div class="off-img off-img-ph">🛒</div>'}
              <div class="off-txt">
                <b>${esc(f.fullName || f.name || '未命名商品')}</b>
                <span class="tiny muted">条码 ${esc(f.code)}${f.quantity ? ' · 净含量 ' + esc(f.quantity) : ''}${f.serving ? ' · 每份 ' + esc(f.serving) : ''}</span>
              </div>
            </div>
            ${noNutri
              ? `<div class="calc-warn" style="margin-top:12px">数据库里这条只有名字，没有营养数据。点下面的按钮，名字会带过去，你照着包装补上数字就行。</div>`
              : `<div class="calc-h" style="margin-top:12px">每 100 克的营养（勾选要导入的）</div>
                 <div class="off-rows">
                   ${chkText('name', nameHTML)}
                   ${chk('kcal', '热量', f.kcal, ' 千卡')}
                   ${chk('p', '蛋白质', f.p, ' g')}
                   ${chk('f', '脂肪', f.f, ' g')}
                   ${chk('c', '碳水化合物', f.c, ' g')}
                 </div>
                 <div class="calc-note">这些是网友填进公开数据库的，可能和包装不一致。导入后你会看到一份可修改的表，核对一下再保存。</div>`}
            <div class="off-actions">
              <button class="btn sm primary" data-import type="button">${noNutri ? '照着包装填' : '导入并核对'}</button>
              <button class="btn sm ghost" data-tomanual type="button">手填</button>
            </div>
          </div>`;
        // 没有营养数据时，至少把名字带过去，别让用户重打一遍
        const imp = $('[data-import]', mask);
        if (imp) imp.addEventListener('click', () => {
          const picked = {};
          $$('[data-off]', mask).forEach((c) => { picked[c.dataset.off] = c.checked; });
          if (noNutri && !('name' in picked)) picked.name = true;
          const code = f.code;
          stopScan();
          close();
          openBarcodeConfirmSheet(f, picked, code);
        });
        const tm = $('[data-tomanual]', mask);
        if (tm) tm.addEventListener('click', () => { stopScan(); close(); openPhotoFoodSheet(); });
      }

      /* ---- 相机扫码 ---- */
      function bindCam() {
        const cam = $('[data-cam]', mask);
        if (!cam) return;
        cam.addEventListener('click', async () => {
          const video = $id('scanVideo');
          cam.disabled = true;
          cam.textContent = '正在打开…';
          try {
            detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
          } catch (e) {
            try { detector = new BarcodeDetector(); } catch (e2) { detector = null; }
          }
          if (!detector) {
            cam.disabled = false; cam.textContent = '打开相机扫';
            show('这个浏览器装不了条码识别，请手输数字');
            return;
          }
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.hidden = false;
            // 不能 await play()：某些情况下它一直不 resolve，界面就会永远卡在"正在打开…"。
            // 让它在后台自己播，我们先把界面切到扫码状态。
            const playing = video.play();
            if (playing && typeof playing.catch === 'function') playing.catch(() => {});
            $id('scanBar').hidden = false;
            $id('scanLine').hidden = false;
            $id('scanArea').classList.add('live');
            // 相机已经起来了，按钮恢复可用（万一 stopCam 之后还想再开）
            cam.disabled = false;
            cam.textContent = '打开相机扫';
            tickStart = 0;
            tick();
          } catch (e) {
            cam.disabled = false; cam.textContent = '打开相机扫';
            show('打不开相机，请直接手输条码数字');
          }
        });
        const stop = $('[data-stop]', mask);
        if (stop) stop.addEventListener('click', () => {
          stopScan();
          const v = $id('scanVideo');
          if (v) { v.hidden = true; v.srcObject = null; }
          $id('scanBar').hidden = true;
          $id('scanLine').hidden = true;
          $id('scanArea').classList.remove('live');
        });
      }

      async function tick() {
        const video = $id('scanVideo');
        if (!video || video.hidden || !detector || busy) { raf = requestAnimationFrame(tick); return; }
        if (video.readyState < 2) {
          // 相机开了却迟迟没有画面（后台标签页、权限被撤、接口异常）：别无限空转
          if (!tickStart) tickStart = Date.now();
          if (Date.now() - tickStart > 10000) {
            stopScan();
            video.hidden = true; video.srcObject = null;
            const bar = $id('scanBar'); if (bar) bar.hidden = true;
            const ln = $id('scanLine'); if (ln) ln.hidden = true;
            const cam = $('[data-cam]', mask);
            if (cam) { cam.disabled = false; cam.textContent = '打开相机扫'; }
            show('相机没有画面，请直接手输条码数字');
            return;
          }
          raf = requestAnimationFrame(tick); return;
        }
        busy = true;
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length) {
            const code = cleanBarcode(codes[0].rawValue);
            if (code && code !== lastCode) {
              lastCode = code;
              input.value = code;
              stopScan();
              video.hidden = true;
              video.srcObject = null;
              $id('scanBar').hidden = true;
              $id('scanLine').hidden = true;
              $id('scanArea').classList.remove('live');
              toast('扫到 ' + code + '，正在查询');
              await lookup(code);
              busy = false;
              return;
            }
          }
        } catch (e) { /* 单帧失败无所谓，继续下一帧 */ }
        busy = false;
        raf = requestAnimationFrame(tick);
      }
      bindCam();

      input.addEventListener('input', clearErr);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(input.value); });
      $('[data-lookup]', mask).addEventListener('click', () => lookup(input.value));
    },
  });
}

/* 条码查到的数据 → 可核对的表（和拍照录入共用同一个表单，只多一个条码字段） */
function openBarcodeConfirmSheet(f, picked, code) {

      hasNutrition: !(f.kcal === null && f.p === null && f.f === null && f.c === null),
    },

}

/* 把「组数 × 次数 + 重量」拼成一行说明 */
function exerciseSpec(e) {
  const parts = [];
  if (e.sets && e.reps) parts.push(`${e.sets} 组 × ${e.reps} 次`);
  else if (e.reps) parts.push(`${e.reps} 次`);
  else if (e.sets) parts.push(`${e.sets} 组`);
  if (e.weight) parts.push(`${e.weight}${/^\d+(\.\d+)?$/.test(String(e.weight)) ? 'kg' : ''}`);
  return parts.join(' · ');
}

        <p>动作名称随便写，比如「杠铃卧推」「快走 30 分钟」。可以一个个加，也可以把原来的计划表整段粘贴进来，我会自动拆成一条条。</p>
      </div></div>`}`;
}

// 一行文本 → 动作。支持「杠铃卧推 4x8 60kg」「深蹲 5组×5次 100」这类常见写法
function parseExerciseLine(line) {
  let s = String(line).trim().replace(/^[\s\-•·*0-9.、)）]+/, '').trim();
  if (!s) return null;
  const out = { id: uid(), name: s, sets: '', reps: '', weight: '' };
  // 重量：末尾的 60kg / 60公斤 / 100lb
  const wm = s.match(/([\d.]+)\s*(kg|KG|公斤|千克|lb|磅)\s*$/);
  if (wm) { out.weight = wm[1]; s = s.slice(0, wm.index).trim(); }
  // 组×次：4x8 / 4×8 / 4组x8次 / 4组8次 / 4*8
  const sm = s.match(/(\d+)\s*(?:组)?\s*[x×*✕]\s*(\d+)\s*(?:次|个|rm|RM)?$/i);
  if (sm) { out.sets = sm[1]; out.reps = sm[2]; s = s.slice(0, sm.index).trim(); }
  else {
    // 只有次数：3×12 已处理；单独「12次」或「30分钟」不当次数
    const rm = s.match(/(\d+)\s*(?:次|个)\s*$/);
    if (rm && !/(分钟|min|秒)/.test(s)) { out.reps = rm[1]; s = s.slice(0, rm.index).trim(); }
    const setm = s.match(/(\d+)\s*组\s*$/);
    if (setm) { out.sets = setm[1]; s = s.slice(0, setm.index).trim(); }
  }
  // 时间型（有氧）：保留在名称里，不当作次数
  if (/(分钟|min|小时|公里|km|米)/i.test(s)) { out.sets = ''; out.reps = ''; }
  if (/(分钟|min|小时|公里|km)/i.test(s) && !out.weight) { out.weight = ''; }
  out.name = s.trim() || out.name;
  return out;
}

function openPlanEditor(plan, isNew) {
  // 深拷贝，取消时不影响原数据
  const draft = {
    id: plan.id,
    name: plan.name,
    ex: plan.ex.map((e) => ({ ...e })),
    rest: !!plan.rest,
  };
  let view = 'list';   // 'list' | 'paste'

  const rowsHTML = () => draft.ex.map((e, i) => `
    <div class="ex-edit-row" data-row="${i}">
      <div class="top">
        <input class="input" data-f="name" value="${esc(e.name)}" placeholder="动作名称，如：杠铃卧推">
        <button class="mini-x" data-del="${i}" aria-label="删除第 ${i + 1} 个动作">✕</button>
      </div>
      <div class="nums">
        <div class="field"><label>组数</label><input class="input" data-f="sets" inputmode="numeric" value="${esc(e.sets)}" placeholder="4"></div>
        <div class="field"><label>每组次数</label><input class="input" data-f="reps" inputmode="numeric" value="${esc(e.reps)}" placeholder="8"></div>
        <div class="field"><label>重量</label><input class="input" data-f="weight" inputmode="decimal" value="${esc(e.weight)}" placeholder="60kg"></div>
      </div>
    </div>`).join('');

  const listBody = () => `
    <div class="field">
      <label for="plName">计划名称</label>
      <input class="input" id="plName" value="${esc(draft.name)}" placeholder="例如：推日 + 有氧" autocomplete="off">
    </div>
    <button class="check" data-rest aria-pressed="${draft.rest}" type="button">
      <span class="box">${ICON.check}</span>
      <span class="t"><b>把这一天标记为休息日</b><span>训练页会显示"今天休息"，不用填动作</span></span>
    </button>
    <div>
      <div class="sec-title" style="padding-bottom:8px">动作（${draft.ex.length}）</div>
      <div class="ex-editor" id="exEditor">${rowsHTML() || '<div class="meal-empty">还没有动作，点下面「添加动作」或「整段粘贴」</div>'}</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn sm ghost" data-add-ex style="flex:1">＋ 添加动作</button>
      <button class="btn sm ghost" data-to-paste style="flex:1">整段粘贴</button>
    </div>
    <div class="err" id="plErr" hidden></div>`;

  const pasteBody = () => `
    <div class="field">
      <label for="pasteArea">把计划粘进来，一行一个动作</label>
      <textarea class="input" id="pasteArea" placeholder="杠铃卧推 4x8 60kg
上斜哑铃卧推 3x10 22.5kg
绳索下压 3x12 25kg
侧平举 3x15 10kg
快走 30分钟"></textarea>
    </div>
    <div class="hint" style="text-wrap:pretty">
      组数 × 次数和重量会自动认出来；认不出的就整行当动作名称，不影响使用。有氧写「快走 30分钟」这样就行。
    </div>
    <div id="pastePreview" class="tiny muted"></div>`;

  openSheet({
    title: isNew ? '新建训练计划' : '编辑计划',
    bodyHTML: listBody(),
    footerHTML: `<button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-save>保存</button>`,
    onMount(mask, close) {
      const bodyEl = $('.sheet-b', mask);
      const nameEl = () => $('#plName', mask);
      const errEl = () => $('#plErr', mask);

      // 把界面上的输入同步回 draft，避免重绘丢内容
      function collect() {
        const n = nameEl();
        if (n) draft.name = n.value;
        $$('.ex-edit-row', mask).forEach((row) => {
          const i = Number(row.dataset.row);
          if (!draft.ex[i]) return;
          $$('input[data-f]', row).forEach((inp) => { draft.ex[i][inp.dataset.f] = inp.value; });
        });
      }

      function renderList() {
        bodyEl.innerHTML = listBody();
        bindList();
      }
      function renderPaste() {
        bodyEl.innerHTML = pasteBody();
        bindPaste();
      }

      function bindList() {
        $('[data-rest]', mask).addEventListener('click', (e) => {
          collect();
          draft.rest = !draft.rest;
          e.currentTarget.setAttribute('aria-pressed', String(draft.rest));
        });
        $('[data-add-ex]', mask).addEventListener('click', () => {
          collect();
          draft.ex.push({ id: uid(), name: '', sets: '', reps: '', weight: '' });
          renderList();
          const rows = $$('.ex-edit-row input[data-f="name"]', mask);
          const last = rows[rows.length - 1];
          if (last) { last.focus(); last.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        });
        $('[data-to-paste]', mask).addEventListener('click', () => { collect(); renderPaste(); });
        $$('[data-del]', mask).forEach((b) => b.addEventListener('click', () => {
          collect();
          draft.ex.splice(Number(b.dataset.del), 1);
          renderList();
        }));
      }

      function bindPaste() {
        const area = $('#pasteArea', mask);
        const prev = $('#pastePreview', mask);
        area.addEventListener('input', () => {
          const items = area.value.split('\n').map(parseExerciseLine).filter(Boolean);
          prev.textContent = items.length ? `认出了 ${items.length} 个动作：${items.slice(0, 4).map((x) => x.name + (x.sets ? ` ${x.sets}×${x.reps}` : '') + (x.weight ? ` ${x.weight}kg` : '')).join('、')}${items.length > 4 ? ' …' : ''}` : '';
        });
        area.focus();
      }

      $('[data-save]', mask).addEventListener('click', () => {
        // 如果在粘贴页，先把手输的动作吃进去
        const area = $('#pasteArea', mask);
        if (area) {
          const items = area.value.split('\n').map(parseExerciseLine).filter(Boolean);
          if (items.length) draft.ex = items;
          draft.name = draft.name && draft.name !== '未命名计划' ? draft.name : (items.length ? '训练计划' : draft.name);
        } else {
          collect();
        }
        draft.name = String(draft.name || '').trim();
        const err = errEl();
        if (!draft.name) {
          if (err) { err.hidden = false; err.textContent = '给计划起个名字，比如「推日」「拉日」'; }
          return;
        }
        const cleaned = draft.ex
          .map((e) => ({ ...e, name: String(e.name || '').trim(), sets: String(e.sets || '').trim(), reps: String(e.reps || '').trim(), weight: String(e.weight || '').trim() }))
          .filter((e) => e.name);
        const next = { id: draft.id, name: draft.name, ex: cleaned, rest: draft.rest, createdAt: Date.now() };
        const idx = S.plans.findIndex((p) => p.id === draft.id);
        if (idx >= 0) S.plans[idx] = next;
        else {
          S.plans.push(next);
          // 新建的计划直接用在今天：否则用户建完计划，训练页还是"今天没有安排训练"，
          // 会以为没建成功。（手动指定优先后，仍可用"改回排期"退回排期）
          if (!trainOf(UI.date).planId) setTodayPlan(UI.date, next.id);
        }
        saveState();
        close();
        toast(isNew ? `已创建「${next.name}」，${cleaned.length} 个动作` : '计划已保存');
        rerender();
      });

      // 首次挂载时把「列表页」的交互绑上（之前漏了这一步，按钮会点了没反应）
      bindList();
    },
  });
}

    { key: 'protein', name: '蛋白', color: 'var(--prot)', hex: '#22C55E', grams: T ? T.macroG.protein : 0 },
    { key: 'fat', name: '脂肪', color: 'var(--fat)', hex: '#EAB308', grams: T ? T.macroG.fat : 0 },

  const kcalEach = {
    carbs: r0(((T ? T.target : 0) * t.carbs) / 100),
    protein: r0(((T ? T.target : 0) * t.protein) / 100),
    fat: r0(((T ? T.target : 0) * t.fat) / 100),

  return `
    ${rows.map((r) => `
      <div style="margin-bottom:14px" data-macro-row="${r.key}">
        <div class="macro-top" style="margin-bottom:2px">
          <span class="name"><i class="dot" style="background:${r.color}"></i>${r.name}</span>
          <span class="pct num" style="color:${r.color}">${t[r.key]}%</span>
          <span class="g num">${r.grams} g · ${fmtN(kcalEach[r.key])} 千卡</span>
        </div>
        <input type="range" min="10" max="75" step="5" value="${t[r.key]}" data-macro="${r.key}"
          style="width:100%;height:32px;accent-color:${r.hex}" aria-label="${r.name}比例">

      改动一项，其余两项会自动让出或补上，合计始终是 100%。左右拖动试试看，下面的热量目标会跟着变。

}

/* 曲线图（原生 canvas 绘制，零依赖） */
/* 图表容器在首次渲染时可能还没拿到宽度，重试几次等排版完成 */
function drawChartsSoon(tries) {
  const n = tries || 0;
  requestAnimationFrame(() => {
    const w = $('#chartWeight');
    const ready = w && w.clientWidth > 0;
    if (ready || n >= 8) drawCharts();
    else drawChartsSoon(n + 1);
  });
}

function bodySeries(range) {
  const from = range ? shiftKey(todayKey(), -(range - 1)) : null;
  const map = new Map();
  for (const b of S.bodyLog) {
    if (from && b.date < from) continue;
    map.set(b.date, b);
  }
  if (!map.has(todayKey()) && S.profile.weight) {
    map.set(todayKey(), { date: todayKey(), weight: S.profile.weight, bodyFat: S.profile.bodyFat || null, fromProfile: true });
  }
  return [...map.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
}

function renderCharts() {
  const series = bodySeries(UI.chartRange);
  const fatSeries = series.filter((x) => x.bodyFat != null);
  if (series.length < 2) {
    return `<div class="empty">
      <span class="ico">📈</span>
      <b>${series.length ? '再多记几天就能看出趋势' : '还没有体重数据'}</b>
      <p>每天固定时间（建议早上空腹）称一次，记满 3~4 次就能看到大概走向了。</p>
      <button class="btn sm primary" data-add-body style="margin-top:4px">记录今天的体重</button>
    </div>`;
  }
  // 没有体脂数据的用户占多数（体脂秤不是人人有），别给他画一张空图
  const fatBlock = fatSeries.length >= 2
    ? `<div class="chart-wrap" style="margin-top:10px"><canvas id="chartFat" height="150"></canvas></div>
       <div class="chart-legend"><span><i style="background:var(--carb)"></i>体脂率 (%)</span></div>`
    : `<div class="tiny muted" style="margin-top:10px;line-height:1.5;text-wrap:pretty">
         ${fatSeries.length === 1 ? '体脂率只记了 1 次，再记 1 次就能画出曲线。' : '没有记录体脂率，所以只显示体重曲线。有体脂秤的话记一下，能看出掉的是脂肪还是水分。'}
       </div>`;
  return `
    <div class="chart-wrap"><canvas id="chartWeight" height="150"></canvas></div>
    <div class="chart-legend"><span><i style="background:var(--brand)"></i>体重 (kg)</span></div>
    ${fatBlock}
    ${renderTrend(series)}`;
}

function renderTrend(series) {
  const first = series[0], last = series[series.length - 1];
  const days = Math.max(1, Math.round((parseKey(last.date) - parseKey(first.date)) / 86400000));
  const dw = last.weight - first.weight;
  const perWeek = (dw / days) * 7;   // 先算"每天多少"，再乘 7，避免短期数据被放大
  const g = goalObj(S.profile.goal);
  const T = calcTargets(S.profile, S.targets);
  const fatSeries = series.filter((x) => x.bodyFat != null);
  let fatTxt = '';
  if (fatSeries.length >= 2) {
    const df = fatSeries[fatSeries.length - 1].bodyFat - fatSeries[0].bodyFat;
    fatTxt = `体脂率 ${df <= 0 ? '下降' : '上升'} ${Math.abs(r1(df))}%（${r1(fatSeries[0].bodyFat)}% → ${r1(fatSeries[fatSeries.length - 1].bodyFat)}%）`;
  }

  // 按目标的每日热量缺口换算成每周应该掉多少：1 kg 脂肪 ≈ 7700 千卡
  // 原来这里用 4.33（一个月几周）来算，结果放大了 3 倍，会显示"每周应该 −3.2 kg"这种假目标
  const targetPerWeek = T && T.deficit > 0 ? -((T.deficit * 7) / 7700) : 0;

  // 平台期判断：近 7 天几乎没动，但之前是有在掉的
  const half = Math.max(3, Math.round(days / 2));
  const recent = series.filter((x) => Math.round((parseKey(last.date) - parseKey(x.date)) / 86400000) <= 7);
  const flat = recent.length >= 2 ? recent[recent.length - 1].weight - recent[0].weight : null;
  const dropping = perWeek < -0.1;
  const plateau = dropping && flat !== null && flat > -0.15;

  // 判断好坏：平台期即使总体在掉，也不该显示成"一切正常"的绿色
  const goingRight = (perWeek < -0.05 && S.profile.goal.startsWith('lose')) || (perWeek > 0.05 && S.profile.goal === 'gain');
  const cls = plateau ? 'warn' : (goingRight ? 'good' : 'warn');
  const judge = plateau
    ? '近一周变化很小，可能到了平台期'
    : perWeek < -0.05 && S.profile.goal.startsWith('lose')
      ? '方向正确'
      : perWeek > 0.05 && S.profile.goal.startsWith('lose')
        ? '体重在涨，留意一下饮食'
        : '变化不大';

  // 变化很小的时候别写成"＋0 kg"，直接说"基本没变"
  const signed = (v, digits) => (Math.abs(v) < 0.05 ? '0' : (v > 0 ? '+' : '−') + Math.abs(r1(v)).toFixed(digits === undefined ? 1 : digits));
  const dwTxt = Math.abs(dw) < 0.05 ? '基本没变' : `${signed(dw)} kg`;
  const pwTxt = Math.abs(perWeek) < 0.05 ? '基本没变' : `${signed(perWeek)} kg`;

  // 只有真的掉得比目标快时，才提醒"不一定更好"；否则不必吓唬人
  const tooFast = perWeek < targetPerWeek - 0.15;
  const rateNote = targetPerWeek
    ? `<div class="tiny muted" style="margin-top:4px">按${g.name}的目标，每周大约 ${targetPerWeek < 0 ? '−' : '+'}${Math.abs(r1(targetPerWeek))} kg。${tooFast ? '你现在掉得比这快，掉太快容易掉肌肉，可以适当多吃一点。' : ''}</div>`
    : '';

  return `<div class="trend ${cls}">
    ${days} 天共 <b>${dwTxt}</b>${Math.abs(dw) < 0.05 ? '' : `（平均每周 <b>${pwTxt}</b>）`} · ${judge}
    ${rateNote}
    ${plateau ? `<div class="tiny muted" style="margin-top:4px">连续一两周不动很常见，不用急着再减热量。可以先看看这几天的记录准不准（有没有漏记），或者把训练量提一点。</div>` : ''}
    ${fatTxt ? `<div class="tiny muted" style="margin-top:4px">${fatTxt}</div>` : ''}
  </div>`;
}

function drawCharts() {
  const series = bodySeries(UI.chartRange);
  if (series.length < 2) return;
  const w = $('#chartWeight');
  if (!w) return;
  // 首次渲染时画布可能还没排好版（clientWidth 是 0，只有 <canvas> 默认的 300px 宽），
  // 这时画出来会被拉伸。宽度没量准就先等下一帧再画。
  if (!w.clientWidth) { requestAnimationFrame(drawCharts); return; }
  drawLine(w, series, 'weight', 'var(--brand)', 'kg');
  // 体脂图可能压根没渲染（没数据时），drawLine 自己会处理 null
  drawLine($('#chartFat'), series.filter((x) => x.bodyFat != null), 'bodyFat', 'var(--carb)', '%');
}
function drawLine(canvas, data, key, color, unit) {
  if (!canvas) return;
  if (data.length < 2) {
    const c = canvas.getContext('2d');
    const w = canvas.clientWidth || 320, h = 150;
    canvas.width = w * (window.devicePixelRatio || 1);
    canvas.height = h * (window.devicePixelRatio || 1);
    c.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    c.fillStyle = getComputedStyle(document.body).color;
    c.globalAlpha = 0.4;
    c.font = '13px system-ui';
    c.textAlign = 'center';
    c.fillText('数据还不够，再多记几天', w / 2, h / 2);
    return;
  }
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 320;
  const h = 150;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  const padL = 38, padR = 34, padT = 12, padB = 22;
  const iw = w - padL - padR, ih = h - padT - padB;
  const vals = data.map((d) => d[key]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < (key === 'weight' ? 1.2 : 1.2)) { const m = (max + min) / 2; min = m - 1; max = m + 1; }
  const pad = (max - min) * 0.18;
  min -= pad; max += pad;

  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue('--line').trim() || '#e5e7eb';
  const text2 = css.getPropertyValue('--text-2').trim() || '#666';
  const brand = css.getPropertyValue(color.startsWith('var(') ? color.slice(4, -1) : '--brand').trim() || '#f97316';

  const X = (i) => padL + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const Y = (v) => padT + ih - ((v - min) / (max - min)) * ih;

  // 网格 + Y 轴刻度
  c.strokeStyle = line; c.lineWidth = 1; c.font = '11px system-ui'; c.fillStyle = text2;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const v = min + ((max - min) * i) / 3;
    const y = Y(v);
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - padR, y); c.stroke();
    // 刻度值去掉多余的尾随零：79.80 → 79.8，82.00 → 82
    const tick = Math.round(v * 10) / 10;
    c.fillText(String(tick), padL - 6, y);
  }
  // X 轴日期
  c.textAlign = 'center'; c.textBaseline = 'top';
  const ticks = data.length <= 4 ? data.length : 4;
  for (let i = 0; i < ticks; i++) {
    const idx = Math.round((i / (ticks - 1 || 1)) * (data.length - 1));
    const d = parseKey(data[idx].date);
    c.fillText(`${d.getMonth() + 1}/${d.getDate()}`, X(idx), h - padB + 5);
  }

  // 折线 + 面积
  c.beginPath();
  data.forEach((d, i) => { const x = X(i), y = Y(d[key]); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.strokeStyle = brand; c.lineWidth = 2.5; c.lineJoin = 'round'; c.lineCap = 'round';
  c.stroke();
  const grad = c.createLinearGradient(0, padT, 0, padT + ih);
  grad.addColorStop(0, hexA(brand, 0.22)); grad.addColorStop(1, hexA(brand, 0));
  c.lineTo(X(data.length - 1), padT + ih); c.lineTo(X(0), padT + ih); c.closePath();
  c.fillStyle = grad; c.fill();

  // 数据点
  data.forEach((d, i) => {
    c.beginPath(); c.arc(X(i), Y(d[key]), 3.4, 0, Math.PI * 2);
    c.fillStyle = brand; c.fill();
    c.strokeStyle = css.getPropertyValue('--card').trim() || '#fff'; c.lineWidth = 1.6; c.stroke();
  });
  // 末端数值
  const lastD = data[data.length - 1];
  c.fillStyle = brand; c.font = '600 12px system-ui'; c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText(r1(lastD[key]) + unit, Math.min(X(data.length - 1) + 12, w - padR + 22), Y(lastD[key]) - 6);
}
function hexA(hex, a) {
  const h = String(hex).trim().replace('#', '');
  if (h.length !== 6) return `rgba(249,115,22,${a})`;
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* 目标变了多少，说清楚是"从多少变到多少"，不要只报一个结果 */
function diffLine(before, after) {
  if (!before || !after) return '';
  const d = after.target - before.target;
  if (Math.abs(d) < 1) {
    return `<div class="adj-diff same">每天该吃的量没变：<b class="num">${fmtN(after.target)}</b> 千卡</div>`;
  }
  const up = d > 0;
  return `<div class="adj-diff ${up ? 'up' : 'down'}">
    每天该吃 <b class="num">${fmtN(before.target)}</b> → <b class="num">${fmtN(after.target)}</b> 千卡
    <span>（${up ? '多了' : '少了'} ${fmtN(Math.abs(d))} 千卡）</span>
  </div>`;
}

function logBody(weight, bodyFat) {
  const date = todayKey();
  const exist = S.bodyLog.find((x) => x.date === date);
  if (exist) {
    exist.weight = weight;
    if (bodyFat != null) exist.bodyFat = bodyFat;
  } else {
    S.bodyLog.push({ date, weight, bodyFat: bodyFat == null ? null : bodyFat });
  }
  S.bodyLog.sort((a, b) => (a.date < b.date ? -1 : 1));
}

          <input class="input" id="bdW" type="number" inputmode="decimal" value="${r1((today && today.weight) || p.weight || '')}" placeholder="公斤"></div>
        <div class="field"><label for="bdF">体脂率 %（可不填）</label>
          <input class="input" id="bdF" type="number" inputmode="decimal" value="${(today && today.bodyFat) || ''}" placeholder="选填"></div>
      </div>
      <div class="hint" style="text-wrap:pretty">建议每天固定时间称（比如早上上完厕所、吃早饭前），这样数据才有可比性。记录后体重会同步为「当前体重」。</div>
      <div class="err" id="bdErr" hidden></div>`,
    footerHTML: `<button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-ok>保存</button>`,
    onMount(mask, close) {
      $('[data-ok]', mask).addEventListener('click', () => {
        const w = Number($('#bdW', mask).value);
        const f = Number($('#bdF', mask).value);
        const err = $('#bdErr', mask);
        if (!(w >= 30 && w <= 300)) { err.hidden = false; err.textContent = '体重请填 30~300 公斤之间的数字'; return; }
        S.profile.weight = w;
        if (f > 0) S.profile.bodyFat = f;
        logBody(w, f > 0 ? f : null);
        saveState();
        close();
        toast('已记录');
        rerender();
      });
    },
  });
}

/* 导出 / 导入 */
function exportData() {
  try {
    const payload = { app: APP_NAME, version: STATE_VERSION, exportedAt: new Date().toISOString(), state: S };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `食训记备份-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('备份已导出，请妥善保存这个文件');
  } catch (e) {
    console.warn(e);
    toast('导出失败，请换一个浏览器试试');
  }
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(String(reader.result)); }
    catch (e) { toast('这个文件不是有效的备份文件'); return; }
    const st = obj && obj.state ? obj.state : obj;
    if (!st || typeof st !== 'object' || (!st.days && !st.profile)) {
      toast('这个文件里没有可识别的数据'); return;
    }
    const dayCount = st.days ? Object.keys(st.days).length : 0;
    confirmSheet({
      title: '导入这份备份？',
      message: `备份里有 ${dayCount} 天的饮食记录。导入会覆盖当前的记录，覆盖后无法撤销。`,
      confirmText: '导入并覆盖',
      danger: true,
      onConfirm() {
        const base = defaultState();
        S = {
          ...base, ...st,
          profile: { ...base.profile, ...(st.profile || {}) },
          targets: { ...base.targets, ...(st.targets || {}) },
          meta: { ...base.meta, ...(st.meta || {}) },
        };
        if (saveState()) { toast('导入成功'); go('home'); }
      },
    });
  };
  reader.onerror = () => toast('读取文件失败');
  reader.readAsText(file);
}

/* ============================================================
   11. 首次设置向导
   ============================================================ */
function renderWizard(view) {
  const step = UI.wizard.step;
  if (!UI.wizard.draft) {
    UI.wizard.draft = { sex: 'male', age: '', height: '', weight: '', bodyFat: '', activity: 'light', goal: 'lose-normal' };
  }
  const d = UI.wizard.draft;
  const steps = `
    <div class="steps">${[0, 1, 2].map((i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;

  if (step === 0) {
    view.innerHTML = `
      ${steps}
      <section class="card" style="gap:16px;display:flex;flex-direction:column">
        <div>
          <div class="wiz-title">先了解一下你</div>
          <p class="wiz-sub" style="margin-top:8px">这几个数字只用来算你每天该吃多少，全部存在你自己电脑里，不会上传到任何地方。</p>
        </div>
        <div class="field"><label>性别</label>
          <div class="seg" id="wSex">
            <button data-v="male" aria-pressed="${d.sex === 'male'}">男</button>
            <button data-v="female" aria-pressed="${d.sex === 'female'}">女</button>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="wAge">年龄</label>
            <input class="input" id="wAge" type="number" inputmode="numeric" value="${d.age}" placeholder="岁"></div>
          <div class="field"><label for="wHeight">身高 (cm)</label>
            <input class="input" id="wHeight" type="number" inputmode="decimal" value="${d.height}" placeholder="厘米"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="wWeight">当前体重 (kg)</label>
            <input class="input" id="wWeight" type="number" inputmode="decimal" value="${d.weight}" placeholder="公斤"></div>
          <div class="field"><label for="wFat">体脂率 %（选填）</label>
            <input class="input" id="wFat" type="number" inputmode="decimal" value="${d.bodyFat}" placeholder="不知道就留空"></div>
        </div>
        <div class="err" id="wErr" hidden></div>
        <button class="btn primary block" data-next>下一步</button>
      </section>`;
    $$('#wSex button', view).forEach((b) => b.addEventListener('click', () => {
      d.sex = b.dataset.v;
      $$('#wSex button', view).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    }));
    $('[data-next]', view).addEventListener('click', () => {
      d.age = $('#wAge', view).value.trim();
      d.height = $('#wHeight', view).value.trim();
      d.weight = $('#wWeight', view).value.trim();
      d.bodyFat = $('#wFat', view).value.trim();
      const age = Number(d.age), h = Number(d.height), w = Number(d.weight);
      const err = $('#wErr', view);
      const fail = (m) => { err.hidden = false; err.textContent = m; };
      if (!(age >= 10 && age <= 100)) return fail('年龄请填 10~100 之间的数字');
      if (!(h >= 100 && h <= 250)) return fail('身高请填 100~250 厘米之间的数字');
      if (!(w >= 30 && w <= 300)) return fail('体重请填 30~300 公斤之间的数字');
      UI.wizard.step = 1; render();
      window.scrollTo({ top: 0 });
    });
    return;
  }

  if (step === 1) {
    view.innerHTML = `
      ${steps}
      <section class="card" style="gap:16px;display:flex;flex-direction:column">
        <div>
          <div class="wiz-title">你平时有多活跃？</div>
          <p class="wiz-sub" style="margin-top:8px">说的是最近一两个月的真实情况，不用往高了选。</p>
        </div>
        <div class="seg" style="flex-direction:column" id="wAct">
          ${ACTIVITY.map((a) => `<button data-v="${a.id}" aria-pressed="${d.activity === a.id}" style="text-align:start;padding:10px 12px;height:auto">
            <b style="display:block;font-size:var(--fs-sm)">${a.name}</b><span class="tiny muted">${a.desc}</span></button>`).join('')}
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn ghost" data-prev style="flex:0 0 96px">上一步</button>
          <button class="btn primary" data-next style="flex:1">下一步</button>
        </div>
      </section>`;
    $$('#wAct button', view).forEach((b) => b.addEventListener('click', () => {
      d.activity = b.dataset.v;
      $$('#wAct button', view).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    }));
    $('[data-prev]', view).addEventListener('click', () => { UI.wizard.step = 0; render(); window.scrollTo({ top: 0 }); });
    $('[data-next]', view).addEventListener('click', () => { UI.wizard.step = 2; render(); window.scrollTo({ top: 0 }); });
    return;
  }

  // 预览：用草稿算一遍
  const draftProfile = {
    sex: d.sex, age: Number(d.age), height: Number(d.height), weight: Number(d.weight),
    activity: d.activity, goal: d.goal,
  };
  const T = calcTargets(draftProfile, { carbs: 45, protein: 30, fat: 25 });
  view.innerHTML = `
    ${steps}
    <section class="card" style="gap:16px;display:flex;flex-direction:column">
      <div>
        <div class="wiz-title">你的目标是？</div>
        <p class="wiz-sub" style="margin-top:8px">选完就能看到每天该吃多少，之后随时可以在「我的」里改。</p>
      </div>
      <div class="seg" style="flex-direction:column" id="wGoal">
        ${GOALS.map((g) => `<button data-v="${g.id}" aria-pressed="${d.goal === g.id}" style="text-align:start;padding:10px 12px;height:auto">
          <b style="display:block;font-size:var(--fs-sm)">${g.name}</b><span class="tiny muted">${g.desc}</span></button>`).join('')}
      </div>
      ${T ? `
        <div class="summary">
          <div class="kv"><span class="k">身体基础消耗</span><span class="v num">${fmtN(T.bmr)}<small>千卡</small></span></div>
          <div class="kv"><span class="k">每日总消耗</span><span class="v num">${fmtN(T.tdee)}<small>千卡</small></span></div>
          <div class="kv big"><span class="k">建议每天吃</span><span class="v num">${fmtN(T.target)}<small>千卡</small></span></div>
          <div class="tiny muted">碳蛋脂默认按 45% / 30% / 25% 分配：碳水 ${T.macroG.carbs}g · 蛋白 ${T.macroG.protein}g · 脂肪 ${T.macroG.fat}g</div>
        </div>` : ''}
      <div style="display:flex;gap:10px">
        <button class="btn ghost" data-prev style="flex:0 0 96px">上一步</button>
        <button class="btn primary" data-finish style="flex:1">开始使用</button>
      </div>
    </section>`;
  $$('#wGoal button', view).forEach((b) => b.addEventListener('click', () => {
    d.goal = b.dataset.v;
    render();
    window.scrollTo({ top: 0 });
  }));
  $('[data-prev]', view).addEventListener('click', () => { UI.wizard.step = 1; render(); window.scrollTo({ top: 0 }); });
  $('[data-finish]', view).addEventListener('click', () => {
    S.profile = {
      sex: d.sex, age: Number(d.age), height: Number(d.height), weight: Number(d.weight),
      bodyFat: d.bodyFat ? Number(d.bodyFat) : null,
      activity: d.activity, goal: d.goal, onboarded: true,
    };
    logBody(Number(d.weight), d.bodyFat ? Number(d.bodyFat) : null);
    S.meta.lastOpen = Date.now();
    saveState();
    toast('设置完成，开始记录吧');
    go('home');
  });
}

/* ============================================================
   12. 事件绑定
   ============================================================ */
function bindView() {
  const view = $('#view');
  const appbar = $('#appbar');

  // 底部导航
  $$('#tabbarIn .tab').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));

  // 顶栏：日期切换
  $$('[data-day]', appbar).forEach((b) => b.addEventListener('click', () => {
    const v = b.dataset.day;
    if (v === 'today') UI.date = todayKey();
    else {
      const next = shiftKey(UI.date, Number(v));
      if (next > todayKey()) return;
      UI.date = next;
    }
    render();
  }));

  // 记录页返回
  const back = $('[data-back]', appbar);
  if (back) back.addEventListener('click', () => go('home'));

  // 首页：餐次卡片 → 记录页
  $$('[data-open-meal]', view).forEach((b) => b.addEventListener('click', () => go('log', { meal: b.dataset.openMeal })));
  $$('[data-quick]', view).forEach((b) => b.addEventListener('click', () => go('log', { meal: b.dataset.quick, resetLog: true })));
  const snack = $('[data-add-snack]', view);
  if (snack) snack.addEventListener('click', () => { UI.showSnack = true; render(); });
  // 漏记提醒：点一下直接跳到那顿的记录页
  const missedBtn = $('[data-quick-missed]', view);
  if (missedBtn) missedBtn.addEventListener('click', () => go('log', { meal: missedBtn.dataset.quickMissed, resetLog: true }));
  // 首页餐次卡片上的常吃组合：一键记整套
  $$('[data-apply-combo]', view).forEach((b) => b.addEventListener('click', () => applyCombo(b.dataset.applyCombo)));
  // 记录页里的组合：应用 / 保存 / 管理
  $$('[data-save-combo]', view).forEach((b) => b.addEventListener('click', () => openSaveComboSheet(UI.log.meal)));
  $$('[data-manage-combos]', view).forEach((b) => b.addEventListener('click', openComboManageSheet));
  const teaser = $('[data-train-teaser]', view);
  if (teaser) teaser.addEventListener('click', () => go('train'));

  // 删除某条记录
  $$('[data-del]', view).forEach((b) => b.addEventListener('click', () => {
    const [mealId, entryId] = b.dataset.del.split('|');
    const e = entriesOf(UI.date, mealId).find((x) => x.id === entryId);
    const m = MEALS.find((x) => x.id === mealId);
    confirmSheet({
      title: '删除这条记录？',
      message: `${e ? e.name + ' ' + e.grams + 'g · ' + fmtN(e.kcal) + ' 千卡' : ''}（${m ? m.name : ''}）`,
      confirmText: '删除',
      danger: true,
      onConfirm() { removeEntry(UI.date, mealId, entryId); rerender(); toast('已删除'); },
    });
  }));

  // 记录页：搜索、分类、选食物
  const search = $('#logSearch', view);
  if (search) {
    search.addEventListener('input', () => {
      UI.log.q = search.value;
      const pos = search.selectionStart;
      render();
      const el = $('#logSearch');
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
    });
  }
  $$('[data-cat]', view).forEach((b) => b.addEventListener('click', () => { UI.log.cat = b.dataset.cat; render(); }));
  $$('[data-food]', view).forEach((b) => b.addEventListener('click', () => {
    const f = findFood(b.dataset.food);
    if (f) openQtySheet(f);
  }));
  const mc = $('[data-mycustom]', view);
  if (mc) mc.addEventListener('click', openCustomFoodSheet);
  const ph = $('[data-photo]', view);
  if (ph) ph.addEventListener('click', openPhotoFoodSheet);
  const sc = $('[data-scan]', view);
  if (sc) sc.addEventListener('click', openScanSheet);

  // 训练页
  $$('[data-train-today]', appbar).forEach((b) => b.addEventListener('click', () => { UI.date = todayKey(); render(); }));
  const planNow = planForToday(UI.date);
  $$('[data-ex-toggle]', view).forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.exToggle;
    const on = b.getAttribute('aria-pressed') !== 'true';
    toggleExercise(UI.date, id, on);
    rerender();
    if (planNow && on) {
      const total = planNow.ex.length;
      const done = planNow.ex.filter((e) => trainOf(UI.date).done.includes(e.id)).length;
      if (done === total && total > 0) toast(`「${planNow.name}」全部完成，今天辛苦了 💪`);
    }
  }));
  $$('[data-ex-note]', view).forEach((b) => b.addEventListener('click', () => {
    if (planNow) openExerciseNoteSheet(b.dataset.exNote, planNow);
  }));
  $$('[data-ex-edit]', view).forEach((b) => b.addEventListener('click', () => {
    if (planNow) openExerciseEditSheet(b.dataset.exEdit, planNow);
  }));
  const fa = $('[data-finish-all]', view);
  if (fa) fa.addEventListener('click', () => {
    if (!planNow) return;
    const left = planNow.ex.filter((e) => !trainOf(UI.date).done.includes(e.id));
    confirmSheet({
      title: '把剩下的动作都标记完成？',
      message: `还有 ${left.length} 个动作没打卡：${left.map((e) => e.name).join('、')}`,
      confirmText: '全部完成',
      onConfirm() { left.forEach((e) => toggleExercise(UI.date, e.id, true)); rerender(); toast('今天的训练完成了 💪'); },
    });
  });
  const epb = $$('[data-edit-plan]', view);
  epb.forEach((b) => b.addEventListener('click', () => { if (planNow) openPlanEditor(planNow, false); }));
  $$('[data-new-plan]', view).forEach((b) => b.addEventListener('click', openNewPlanSheet));
  $$('[data-plan-pick]', view).forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.planPick;
    setTodayPlan(UI.date, id);
    const p = planById(id);
    rerender();
    toast(`今天练「${p ? p.name : ''}」`);
  }));
  $$('[data-sched]', view).forEach((b) => b.addEventListener('click', () => openScheduleSheet(Number(b.dataset.sched))));
  const backSched = $('[data-back-sched]', view);
  if (backSched) backSched.addEventListener('click', () => {
    clearTodayPlan(UI.date);
    rerender();
    const s = scheduledFor(UI.date);
    toast(s ? `已改回排期：「${s.name}」` : '已改回排期');
  });
  const schedOpen = $('[data-sched-open]', view);
  if (schedOpen) schedOpen.addEventListener('click', () => openScheduleSheet(parseKey(UI.date).getDay()));

  // 我的页
  const ep = $('[data-edit-profile]', view);
  if (ep) ep.addEventListener('click', openProfileSheet);
  const ab = $('[data-add-body]', view);
  if (ab) ab.addEventListener('click', openBodySheet);
  const aj = $('[data-adjust]', view);
  if (aj) aj.addEventListener('click', openAdjustSheet);
  const lb = $('[data-log-body]', view);
  if (lb) lb.addEventListener('click', openBodySheet);
  $$('[data-goal]', view).forEach((b) => b.addEventListener('click', () => {
    S.profile.goal = b.dataset.goal; saveState(); rerender();
    toast(`目标已改为${goalObj(b.dataset.goal).name}`);
  }));
  $$('[data-range]', view).forEach((b) => b.addEventListener('click', () => {
    UI.chartRange = Number(b.dataset.range); render();
  }));
  const rm = $('[data-reset-macros]', view);
  if (rm) rm.addEventListener('click', () => { S.targets = { carbs: 45, protein: 30, fat: 25 }; saveState(); rerender(); toast('已恢复 45/30/25'); });
  $$('[data-macro]', view).forEach((el) => el.addEventListener('input', () => {
    const key = el.dataset.macro;
    const rng = macroRange(key, S.targets);
    let v = clamp(Math.round(Number(el.value) / 5) * 5, rng.min, rng.max);
    const others = ['carbs', 'protein', 'fat'].filter((k) => k !== key);
    const rest = 100 - v;
    // 把剩下的百分比按其范围比例分给另外两项
    const sumOther = others.reduce((a, k) => a + S.targets[k], 0) || 1;
    let a1 = Math.round((rest * (S.targets[others[0]] / sumOther)) / 5) * 5;
    a1 = clamp(a1, macroRange(others[0]).min, macroRange(others[0]).max);
    let a2 = rest - a1;
    a2 = clamp(a2, macroRange(others[1]).min, macroRange(others[1]).max);
    a1 = rest - a2;
    S.targets[key] = v; S.targets[others[0]] = a1; S.targets[others[1]] = a2;
    saveState();
    // 只更新相关数字，避免拖动时重建导致滑块跳动
    updateMacroUI();
  }));
  const ex = $('[data-export]', view);
  if (ex) ex.addEventListener('click', exportData);
  const im = $('[data-import]', view);
  const file = $('#importFile', view);
  if (im && file) {
    im.addEventListener('click', () => file.click());
    file.addEventListener('change', () => { if (file.files && file.files[0]) importData(file.files[0]); file.value = ''; });
  }
  const rs = $('[data-reset]', view);
  if (rs) rs.addEventListener('click', () => confirmSheet({
    title: '清除所有数据？',
    message: '所有饮食记录、体重记录和个人设置都会被永久删除，无法恢复。建议先导出备份。',
    confirmText: '全部清除',
    danger: true,
    onConfirm() {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      S = defaultState();
      UI.wizard = { step: 0, draft: null };
      UI.date = todayKey();
      saveState();
      toast('已清除，重新开始');
      render();
    },
  }));

  // 滚动阴影
  const onScroll = () => appbar.classList.toggle('scrolled', window.scrollY > 4);
  window.removeEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* 拖动宏量滑块时，只刷新数字与条形，不重建 DOM */
function updateMacroUI() {
  const view = $('#view');
  if (!view) return;
  const T = calcTargets(S.profile, S.targets);
  const t = S.targets;
  const rows = view.querySelectorAll('[data-macro]');
  rows.forEach((el) => {
    const key = el.dataset.macro;
    el.value = t[key];
    const wrap = el.closest('[data-macro-row]');
    if (!wrap) return;
    const pct = wrap.querySelector('.pct');
    if (pct) pct.textContent = t[key] + '%';
    const g = wrap.querySelector('.g');
    if (g && T) g.textContent = `${T.macroG[key]} g · ${fmtN(r0((T.target * t[key]) / 100))} 千卡`;
  });
  // 顶部目标数字
  const targetEl = view.querySelector('[data-target-value]');
  if (targetEl && T) targetEl.textContent = fmtN(T.target);
}

/* 窗口尺寸变化时重画曲线 */
let rt = null;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (UI.tab === 'me') drawCharts(); }, 200);
});

/* ============================================================
   13. 启动
   ============================================================ */
(function boot() {
  S.meta.lastOpen = Date.now();
  saveState(true);
  render();
  updateMacroUI();
})();
</script>
